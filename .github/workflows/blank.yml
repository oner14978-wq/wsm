name: PC gamer Windows 11 (Azure)
on:
  workflow_dispatch:
    inputs:
      acao:
        description: O que fazer
        type: choice
        options: [criar, status, ligar, desligar, reiniciar, destruir]
        default: criar
      tamanho:
        description: Tamanho da VM (so vale em criar)
        type: choice
        options: [Standard_NV6ads_A10_v5, Standard_D4s_v5]
        default: Standard_NV6ads_A10_v5
permissions:
  contents: read
  id-token: write
env:
  RG: gamerpc-rg
  VM: gamerpc
  USUARIO: Rafael
  LOC: ${{ vars.AZ_LOCATION || 'eastus' }}
jobs:
  pc:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZ_CLIENT_ID || vars.AZ_CLIENT_ID }}
          tenant-id: ${{ secrets.AZ_TENANT_ID || vars.AZ_TENANT_ID }}
          subscription-id: ${{ secrets.AZ_SUBSCRIPTION_ID || vars.AZ_SUBSCRIPTION_ID }}
      - name: Criar o PC (VM real no Azure)
        id: criar
        if: inputs.acao == 'criar'
        env:
          AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          TAM: ${{ inputs.tamanho }}
        run: |
          set -euo pipefail
          if [ -z "$AUTHKEY" ]; then
            echo "::error::O segredo TAILSCALE_AUTH_KEY nao existe ou esta vazio."
            exit 1
          fi
          echo "::add-mask::$AUTHKEY"
          # Senha NAO e mascarada de proposito: ela aparece no resumo final
          PW="$(openssl rand -base64 12 | tr '+/' '-_')aA1!"
          echo "pw=$PW" >> "$GITHUB_OUTPUT"
          az group create -n "$RG" -l "$LOC" -o none
          # O script vai em custom-data SEM nenhum segredo dentro
          az vm create -g "$RG" -n "$VM" --computer-name GAMERPC --size "$TAM" \
            --image MicrosoftWindowsDesktop:windows-11:win11-24h2-ent:latest \
            --admin-username "$USUARIO" --admin-password "$PW" \
            --os-disk-size-gb 240 --storage-sku Premium_LRS --license-type Windows_Client \
            --public-ip-sku Standard --nsg-rule NONE \
            --custom-data scripts/primeiro-boot.ps1 -o none
          if [[ "$TAM" == *NV* ]]; then
            az vm extension set -g "$RG" --vm-name "$VM" --publisher Microsoft.HpcCompute \
              --name NvidiaGpuDriverWindows --version 1.6 -o none
          fi
          # A chave e a senha vao em protected-settings (criptografado, nao aparece em logs nem no portal)
          CMD="powershell -ExecutionPolicy Bypass -Command \"Copy-Item C:\\AzureData\\CustomData.bin C:\\setup.ps1 -Force; & C:\\setup.ps1 -AuthKey '$AUTHKEY' -NomePC '$VM' -Usuario '$USUARIO' -Senha '$PW'\""
          PS=$(jq -nc --arg c "$CMD" '{commandToExecute:$c}')
          echo "::add-mask::$PS"
          az vm extension set -g "$RG" --vm-name "$VM" --publisher Microsoft.Compute \
            --name CustomScriptExtension --version 1.10 \
            --protected-settings "$PS" -o none
      - name: Ligar, desligar, reiniciar ou destruir
        if: contains('ligar desligar reiniciar destruir', inputs.acao)
        env:
          ACAO: ${{ inputs.acao }}
        run: |
          case "$ACAO" in
            ligar) az vm start -g "$RG" -n "$VM" -o none ;;
            desligar) az vm deallocate -g "$RG" -n "$VM" -o none ;;
            reiniciar) az vm restart -g "$RG" -n "$VM" -o none ;;
            destruir) az group delete -n "$RG" --yes --no-wait ;;
          esac
      - name: CONECTAR ANDROID (aguarda o Tailscale e mostra os dados)
        if: inputs.acao == 'criar' || inputs.acao == 'status' || inputs.acao == 'ligar' || inputs.acao == 'reiniciar'
        env:
          ACAO: ${{ inputs.acao }}
          SENHA: ${{ steps.criar.outputs.pw }}
        run: |
          IP=""
          STATE="nao criada"
          TENTATIVAS=40
          [ "$ACAO" = status ] && TENTATIVAS=1
          for i in $(seq 1 "$TENTATIVAS"); do
            STATE=$(az vm get-instance-view -g "$RG" -n "$VM" --query "instanceView.statuses[?starts_with(code,'PowerState')].displayStatus" -o tsv 2>/dev/null || echo "nao criada")
            if [ "$STATE" = "VM running" ]; then
              OUT=$(az vm run-command invoke -g "$RG" -n "$VM" --command-id RunPowerShellScript \
                --scripts '$j = & "C:\Program Files\Tailscale\tailscale.exe" status --json | ConvertFrom-Json; if ($j.BackendState -eq "Running") { & "C:\Program Files\Tailscale\tailscale.exe" ip -4 }' \
                -o json 2>/dev/null || true)
              IP=$(echo "$OUT" | jq -r '.value[0].message // ""' 2>/dev/null | grep -oE '100\.[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
              [ -n "$IP" ] && break
            fi
            [ "$i" -lt "$TENTATIVAS" ] && sleep 20
          done
          if [ -n "$IP" ]; then ON="Conectado"; else ON="Desconectado"; IP="ainda sem IP"; fi
          {
            echo "## CONECTAR ANDROID"
            echo "| Item | Valor |"; echo "|---|---|"
            echo "| Estado da VM | $STATE |"
            echo "| Tailscale | $ON |"
            echo "| IP privado Tailscale | \`$IP\` |"
            echo "| Nome do PC | \`$VM\` |"
            echo "| Sunshine | https://$IP:47990 |"
            echo ""
            echo "1. No Android, instale o **Tailscale** e entre na mesma conta."
            echo "2. Instale o **Moonlight** e adicione o PC pelo IP acima."
            echo "3. No navegador, abra o endereço do Sunshine, crie o usuário e digite o PIN do Moonlight."
            echo ""
            echo "## CONTA WINDOWS"
            echo "| Item | Valor |"; echo "|---|---|"
            echo "| Conta | \`$USUARIO\` |"
            if [ -n "$SENHA" ]; then
              echo "| Senha | \`$SENHA\` |"
            else
              echo "| Senha | definida na criação do PC (veja a execução da ação criar) |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Tailscale: $ON | IP: $IP"
          echo "Conta: $USUARIO"
          [ -n "$SENHA" ] && echo "Senha: $SENHA" || true
          
