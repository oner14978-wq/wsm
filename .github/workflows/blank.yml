
name: PC gamer Windows 11 (Azure)

on:
  workflow_dispatch:
    inputs:
      versao_windows:
        description: Versão do Windows
        type: choice
        options:
          - Windows 11 26H2 x64
        default: Windows 11 26H2 x64

      acao:
        description: O que fazer
        type: choice
        options: [criar, status, ligar, desligar, reiniciar, destruir]
        default: criar

      tamanho:
        description: Tamanho (auto = GPU se houver cota)
        type: choice
        options: [auto, Standard_NV6ads_A10_v5, Standard_D4s_v5]
        default: auto
        
