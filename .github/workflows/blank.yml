name: PC gamer Windows 11 (Azure)
on:
  workflow_dispatch:
    inputs:
      acao:
        description: O que fazer
        type: choice
        options: [criar, status, ligar, desligar, reiniciar, destruir]
        default: criar
      tamanho:
        description: Tamanho da VM (so vale em criar)
        type: choice
        options: [Standard_NV6ads_A10_v5, Standard_D4s_v5]
        default: Standard_NV6ads_A10_v5
permissions:
  contents: read
env:
  RG: gamerpc-rg
  VM: gamerpc
  LOC: ${{ vars.AZ_LOCATION || 'eastus' }}
jobs:
  pc:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Criar o PC (VM real no Azure)
        if: inputs.acao == 'criar'
        env:
          TS_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          TAM: ${{ inputs.tamanho }}
        run: |
          set -euo pipefail
          TOKEN=$(curl -sf -d "client_id=$TS_ID" -d "client_secret=$TS_SECRET" -d grant_type=client_credentials https://api.tailscale.com/api/v2/oauth/token | jq -r .access_token)
          KEY=$(curl -sf -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"expirySeconds":1800,"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":false,"preauthorized":true,"tags":["tag:gamer"]}}}}' \
            https://api.tailscale.com/api/v2/tailnet/-/keys | jq -r .key)
          echo "::add-mask::$KEY"
          PW="$(openssl rand -base64 12 | tr '+/' '-_')aA1!"
          echo "::add-mask::$PW"
          sed -e "s|__AUTHKEY__|$KEY|" -e "s|__HOSTNAME__|$VM|" -e "s|__ADMINPASS__|$PW|" scripts/primeiro-boot.ps1 > /tmp/boot.ps1
          az group create -n "$RG" -l "$LOC" -o none
          az vm create -g "$RG" -n "$VM" --computer-name GAMERPC --size "$TAM" \
            --image MicrosoftWindowsDesktop:windows-11:win11-24h2-ent:latest \
            --admin-username gamer --admin-password "$PW" \
            --os-disk-size-gb 240 --storage-sku Premium_LRS --license-type Windows_Client \
            --public-ip-sku Standard --nsg-rule NONE --custom-data /tmp/boot.ps1 -o none
          if [[ "$TAM" == *NV* ]]; then
            az vm extension set -g "$RG" --vm-name "$VM" --publisher Microsoft.HpcCompute \
              --name NvidiaGpuDriverWindows --version 1.6 -o none
          fi
          az vm extension set -g "$RG" --vm-name "$VM" --publisher Microsoft.Compute \
            --name CustomScriptExtension --version 1.10 \
            --protected-settings '{"commandToExecute":"powershell -ExecutionPolicy Bypass -Command \"Copy-Item C:\\AzureData\\CustomData.bin C:\\setup.ps1 -Force; & C:\\setup.ps1\""}' -o none
      - name: Ligar, desligar, reiniciar ou destruir
        if: contains('ligar desligar reiniciar destruir', inputs.acao)
        env:
          ACAO: ${{ inputs.acao }}
        run: |
          case "$ACAO" in
            ligar) az vm start -g "$RG" -n "$VM" -o none ;;
            desligar) az vm deallocate -g "$RG" -n "$VM" -o none ;;
            reiniciar) az vm restart -g "$RG" -n "$VM" -o none ;;
            destruir) az group delete -n "$RG" --yes --no-wait ;;
          esac
      - name: CONECTAR ANDROID (aguarda o Tailscale e mostra os dados)
        if: inputs.acao == 'criar' || inputs.acao == 'status' || inputs.acao == 'ligar' || inputs.acao == 'reiniciar'
        env:
          TS_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          ACAO: ${{ inputs.acao }}
        run: |
          TOKEN=$(curl -sf -d "client_id=$TS_ID" -d "client_secret=$TS_SECRET" -d grant_type=client_credentials https://api.tailscale.com/api/v2/oauth/token | jq -r .access_token)
          D='{}'
          for i in $(seq 1 85); do
            X=$(curl -sf -H "Authorization: Bearer $TOKEN" https://api.tailscale.com/api/v2/tailnet/-/devices \
              | jq -c '[.devices[] | select(.hostname|ascii_downcase=="gamerpc")][0] // {}' || echo '{}')
            [ -n "$X" ] && D="$X"
            [ "$(echo "$D" | jq -r '.connectedToControl // false')" = true ] && break
            [ "$ACAO" = status ] && break
            sleep 20
          done
          STATE=$(az vm get-instance-view -g "$RG" -n "$VM" --query "instanceView.statuses[?starts_with(code,'PowerState')].displayStatus" -o tsv 2>/dev/null || echo "nao criada")
          IP=$(echo "$D" | jq -r '.addresses[0] // "ainda sem IP"')
          NOME=$(echo "$D" | jq -r '.hostname // "gamerpc"')
          ON=$(echo "$D" | jq -r 'if .connectedToControl then "Conectado" else "Desconectado" end')
          {
            echo "## CONECTAR ANDROID"
            echo "| Item | Valor |"; echo "|---|---|"
            echo "| Estado da VM | $STATE |"
            echo "| Tailscale | $ON |"
            echo "| IP privado | \`$IP\` |"
            echo "| Nome do PC | \`$NOME\` |"
            echo "| Sunshine | https://$IP:47990 |"
            echo ""
            echo "1. No Android, instale o **Tailscale** e entre na mesma conta."
            echo "2. Instale o **Moonlight** e adicione o PC pelo IP acima."
            echo "3. No navegador, abra o endereço do Sunshine, crie o usuário e digite o PIN do Moonlight."
          } >> "$GITHUB_STEP_SUMMARY"
