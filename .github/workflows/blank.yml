name: PC gamer Windows 11 (Azure)
on:
  workflow_dispatch:
    inputs:
      acao:
        description: O que fazer
        type: choice
        options: [criar, status, ligar, desligar, reiniciar, destruir]
        default: criar
      tamanho:
        description: Tamanho (auto = GPU se houver cota, senao 16 GB sem GPU)
        type: choice
        options: [auto, Standard_NV6ads_A10_v5, Standard_D4s_v5]
        default: auto
permissions:
  contents: read
  id-token: write
env:
  RG: gamerpc-rg
  VM: gamerpc
  USUARIO: Rafael
  LOC: ${{ vars.AZ_LOCATION || 'eastus' }}
  REPO: ${{ github.repository }}
  BRANCH: ${{ github.ref_name }}
  ACAO: ${{ inputs.acao }}
  TAM_IN: ${{ inputs.tamanho }}
  AZ_CID: ${{ secrets.AZ_CLIENT_ID || vars.AZ_CLIENT_ID }}
  AZ_TID: ${{ secrets.AZ_TENANT_ID || vars.AZ_TENANT_ID }}
  AZ_SID: ${{ secrets.AZ_SUBSCRIPTION_ID || vars.AZ_SUBSCRIPTION_ID }}
jobs:
  pc:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # ---- 1) LOGIN NO AZURE: usa AZ_* se existirem ----
      - name: Login Azure (AZ_CLIENT_ID, AZ_TENANT_ID)
        if: env.AZ_CID != '' && env.AZ_TID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZ_CID }}
          tenant-id: ${{ env.AZ_TID }}
          subscription-id: ${{ env.AZ_SID }}
          allow-no-subscriptions: true

      # ---- 1b) SEM AZ_*: login por codigo (so na primeira vez) ----
      - name: Login Azure por codigo
        if: env.AZ_CID == '' || env.AZ_TID == ''
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: |
          set +e
          set -uo pipefail
          echo "=== INICIO DO PASSO: $(date -u +%H:%M:%S) UTC ==="
          FALHOU=0
          trap 'rc=$?; if [ "$rc" -ne 0 ] && [ "$FALHOU" = 0 ]; then echo "ERRO INESPERADO: o passo terminou com codigo $rc (linha $LINENO do script)"; echo "::error::Passo falhou com codigo $rc na linha $LINENO"; { echo "## ERRO INESPERADO"; echo "O passo terminou com codigo $rc na linha $LINENO. Abra o log do passo e veja as ultimas linhas."; } >> "$GITHUB_STEP_SUMMARY"; fi' EXIT
          falha() { FALHOU=1; echo ""; echo "=============== ERRO ==============="; echo "$1"; echo "===================================="; echo "::error::$1"; { echo "## Nao foi possivel continuar"; echo ""; echo "$1"; } >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          FILTRO="!starts_with(name,'N/A(tenant')"

          logado=0
          for t in 1 2 3; do
            rm -f /tmp/azlogin.log
            az login --use-device-code --allow-no-subscriptions -o none > /tmp/azlogin.log 2>&1 &
            PID=$!

            CODIGO=""
            for i in $(seq 1 30); do
              CODIGO=$(grep -oE 'enter the code [A-Z0-9]+' /tmp/azlogin.log | awk '{print $4}' | head -1)
              [ -n "$CODIGO" ] && break
              sleep 2
            done
            [ -n "$CODIGO" ] || { echo "Nao apareceu codigo:"; cat /tmp/azlogin.log; kill $PID 2>/dev/null; continue; }

            for i in $(seq 1 36); do
              kill -0 $PID 2>/dev/null || break
              echo ">>> TENTATIVA $t de 3 | CODIGO: $CODIGO | LINK: https://login.microsoft.com/device | restam ~$(( (36 - i) * 20 / 60 )) min <<<"
              sleep 20
            done

            if wait $PID; then logado=1; break; fi
            echo "Login nao concluido nesta tentativa:"; tail -n 5 /tmp/azlogin.log
            kill $PID 2>/dev/null
          done
          [ "$logado" = 1 ] || falha "LOGIN NAO CONCLUIDO. Rode de novo, abra https://login.microsoft.com/device assim que o codigo aparecer e, na ultima tela, toque em Continuar (nao em Cancelar)."

          CONTA=$(az account show --query user.name -o tsv 2>/dev/null)
          conta_total() { az account list --all --refresh --query "[?$FILTRO] | length(@)" -o tsv 2>/dev/null || echo 0; }
          conta_ativas() { az account list --all --refresh --query "[?state=='Enabled' && $FILTRO] | length(@)" -o tsv 2>/dev/null || echo 0; }

          SUB=$(az account list --all --query "[?state=='Enabled' && $FILTRO] | [0].id" -o tsv)
          az account set --subscription "$SUB"
          TEN=$(az account show --query tenantId -o tsv)
          NAME=gamerpc-gh
          APP=$(az ad app list --display-name "$NAME" --query "[0].appId" -o tsv)
          if [ -z "$APP" ]; then
            APP=$(az ad app create --display-name "$NAME" --query appId -o tsv)
          fi
          az ad sp show --id "$APP" -o none 2>/dev/null || az ad sp create --id "$APP" -o none
          ok=0
          for i in 1 2 3 4 5 6; do
            if az role assignment create --assignee "$APP" --role Contributor --scope "/subscriptions/$SUB" -o none 2>/dev/null; then ok=1; break; fi
            if [ -n "$(az role assignment list --assignee "$APP" --scope "/subscriptions/$SUB" --query '[0].id' -o tsv 2>/dev/null)" ]; then ok=1; break; fi
            sleep 15
          done
          [ "$ok" = 1 ] || falha "SEM PERMISSAO: sua conta precisa ser Owner da assinatura para dar o papel Contributor ao app do GitHub."
          CRED="gh-$(echo "$BRANCH" | sed 's/[^A-Za-z0-9-]/-/g')"
          SUBJ="repo:${REPO}:ref:refs/heads/${BRANCH}"
          if [ -z "$(az ad app federated-credential list --id "$APP" --query "[?name=='$CRED'].name" -o tsv)" ]; then
            az ad app federated-credential create --id "$APP" -o none --parameters "$(jq -nc --arg n "$CRED" --arg s "$SUBJ" \
              '{name:$n,issuer:"https://token.actions.githubusercontent.com",subject:$s,audiences:["api://AzureADTokenExchange"]}')"
          fi
          SALVO="nao"
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::GH_ADMIN_TOKEN nao esta configurado. Os 3 valores do Azure NAO serao salvos sozinhos (veja o Summary)."
          else
            SALVO="sim"
            for par in "AZ_CLIENT_ID=$APP" "AZ_TENANT_ID=$TEN" "AZ_SUBSCRIPTION_ID=$SUB"; do
              nome="${par%%=*}"; valor="${par#*=}"
              if gh secret set "$nome" --body "$valor" --repo "$REPO" 2>/tmp/gherr; then
                echo "Secret $nome salvo."
              else
                echo "ERRO ao salvar $nome: $(head -c 300 /tmp/gherr)"
                echo "::warning::Nao consegui salvar $nome. O token GH_ADMIN_TOKEN precisa de permissao Secrets: Read and write neste repositorio."
                SALVO="nao"
              fi
            done
          fi
          {
            echo "## Valores criados do Azure"
            echo "| Segredo | Valor |"; echo "|---|---|"
            echo "| AZ_CLIENT_ID | \`$APP\` |"
            echo "| AZ_TENANT_ID | \`$TEN\` |"
            echo "| AZ_SUBSCRIPTION_ID | \`$SUB\` |"
            echo ""
            if [ "$SALVO" = sim ]; then
              echo "Salvos como secrets do repositorio. Nas proximas execucoes nao pede mais codigo."
            else
              echo "Crie estes 3 como **Secrets** do repositorio para nao pedir codigo nas proximas execucoes."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ---- 3) PREPARAR: provedores, regiao, GPU e cota ----
      - name: Preparar recursos e verificar GPU / cota
        id: prep
        if: inputs.acao == 'criar'
        env:
          AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          set +e
          set -uo pipefail
          echo "=== INICIO DO PASSO: $(date -u +%H:%M:%S) UTC ==="
          FALHOU=0
          trap 'rc=$?; if [ "$rc" -ne 0 ] && [ "$FALHOU" = 0 ]; then echo "ERRO INESPERADO: o passo terminou com codigo $rc (linha $LINENO do script)"; echo "::error::Passo falhou com codigo $rc na linha $LINENO"; { echo "## ERRO INESPERADO"; echo "O passo terminou com codigo $rc na linha $LINENO. Abra o log do passo e veja as ultimas linhas."; } >> "$GITHUB_STEP_SUMMARY"; fi' EXIT
          falha() { FALHOU=1; echo ""; echo "=============== ERRO ==============="; echo "$1"; echo "===================================="; echo "::error::$1"; { echo "## Nao foi possivel criar o PC"; echo ""; echo "$1"; } >> "$GITHUB_STEP_SUMMARY"; exit 1; }

          if [ -z "$AUTHKEY" ]; then
            falha "FALTA O SECRET TAILSCALE_AUTH_KEY. Crie em Settings > Secrets and variables > Actions e rode de novo."
          fi

          for P in Microsoft.Compute Microsoft.Network Microsoft.Storage; do
            az provider register --namespace "$P" --wait -o none 2>/tmp/err \
              || falha "SEM PERMISSAO para ativar o provedor $P. Detalhe: $(head -c 300 /tmp/err)"
          done

          if az vm show -g "$RG" -n "$VM" -o none 2>/dev/null; then
            falha "O PC $VM ja existe. Rode a acao destruir antes de criar de novo."
          fi

          OUTRAS="eastus eastus2 westus2 westus3 southcentralus centralus westeurope northeurope"
          MOTIVOS=""

          livre() {
            echo "$1" | jq -r --arg f "$2" '[.[] | select((.name.value | ascii_downcase) == ($f | ascii_downcase)) | ((.limit | tonumber) - (.currentValue | tonumber))] | .[0] // 0' 2>/dev/null || echo 0
          }

          checa() {
            local R="$1" S="$2" F="$3" V="$4" N RS U FAM TOT
            N=$(az vm list-skus -l "$R" --size "$S" --resource-type virtualMachines --query "length(@)" -o tsv 2>/dev/null || echo 0)
            if [ "${N:-0}" -le 0 ]; then MOTIVOS+=$'\n'"- $S nao e oferecido em $R"; return 1; fi
            RS=$(az vm list-skus -l "$R" --size "$S" --resource-type virtualMachines --query "[0].restrictions | length(@)" -o tsv 2>/dev/null || echo 0)
            if [ "${RS:-0}" != 0 ]; then MOTIVOS+=$'\n'"- $S esta bloqueado para esta assinatura em $R"; return 1; fi
            U=$(az vm list-usage -l "$R" -o json 2>/dev/null || echo '[]')
            FAM=$(livre "$U" "$F"); TOT=$(livre "$U" cores)
            if [ "${FAM:-0}" -lt "$V" ]; then MOTIVOS+=$'\n'"- $S em $R: cota da familia $F = ${FAM:-0} vCPU livres (precisa de $V)"; return 1; fi
            if [ "${TOT:-0}" -lt "$V" ]; then MOTIVOS+=$'\n'"- $S em $R: cota total de vCPU = ${TOT:-0} livres (precisa de $V)"; return 1; fi
            return 0
          }

          ESC=""; REG=""; AVISO=""
          if [ "$TAM_IN" != "Standard_D4s_v5" ]; then
            for R in $LOC $OUTRAS; do
              if checa "$R" Standard_NV6ads_A10_v5 standardNVadsA10v5Family 6; then ESC=Standard_NV6ads_A10_v5; REG="$R"; break; fi
            done
            if [ -z "$ESC" ] && [ "$TAM_IN" = "Standard_NV6ads_A10_v5" ]; then
              falha "SEM COTA/DISPONIBILIDADE DE GPU NVIDIA (A10) em nenhuma regiao testada.$MOTIVOS"$'\n\n'"Para liberar: portal.azure.com > Assinaturas > Uso + cotas, filtre por NVadsA10v5 e peca 6 vCPU."
            fi
          fi
          if [ -z "$ESC" ]; then
            GPUMOT="$MOTIVOS"; MOTIVOS=""
            for R in $LOC $OUTRAS; do
              if checa "$R" Standard_D4s_v5 standardDSv5Family 4; then ESC=Standard_D4s_v5; REG="$R"; break; fi
            done
            if [ -z "$ESC" ]; then
              falha "SEM COTA DE vCPU para criar o PC.$GPUMOT$MOTIVOS"$'\n\n'"Peca aumento em portal.azure.com > Assinaturas > Uso + cotas."
            fi
            if [ "$TAM_IN" != "Standard_D4s_v5" ]; then
              AVISO="Sem GPU: a conta nao tem cota/disponibilidade da NVIDIA A10.$GPUMOT"
            fi
          fi

          if [ "$ESC" = Standard_NV6ads_A10_v5 ]; then RAM="55 GB (menor tamanho com GPU A10)"; GPU="NVIDIA A10 (fracao de 1/6)"; else RAM="16 GB"; GPU="sem GPU"; fi
          echo "Escolhido: $ESC em $REG"
          echo "regiao=$REG" >> "$GITHUB_OUTPUT"
          echo "tamanho=$ESC" >> "$GITHUB_OUTPUT"
          echo "ram=$RAM" >> "$GITHUB_OUTPUT"
          echo "gpu=$GPU" >> "$GITHUB_OUTPUT"
          echo "aviso=$(echo "$AVISO" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      # ---- 4) CRIAR O PC ----
      - name: Criar o PC (VM real no Azure)
        id: criar
        if: inputs.acao == 'criar'
        env:
          AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN || github.token }}
          TAM: ${{ steps.prep.outputs.tamanho }}
          REG: ${{ steps.prep.outputs.regiao }}
          RAM: ${{ steps.prep.outputs.ram }}
          GPU: ${{ steps.prep.outputs.gpu }}
          AVISO: ${{ steps.prep.outputs.aviso }}
        run: |
          set +e
          set -uo pipefail
          echo "=== INICIO DO PASSO: $(date -u +%H:%M:%S) UTC ==="
          FALHOU=0
          trap 'rc=$?; if [ "$rc" -ne 0 ] && [ "$FALHOU" = 0 ]; then echo "ERRO INESPERADO: o passo terminou com codigo $rc (linha $LINENO do script)"; echo "::error::Passo falhou com codigo $rc na linha $LINENO"; { echo "## ERRO INESPERADO"; echo "O passo terminou com codigo $rc na linha $LINENO. Abra o log do passo e veja as ultimas linhas."; } >> "$GITHUB_STEP_SUMMARY"; fi' EXIT
          falha() { FALHOU=1; echo ""; echo "=============== ERRO ==============="; echo "$1"; echo "===================================="; echo "::error::$1"; { echo "## Nao foi possivel concluir"; echo ""; echo "$1"; } >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          traduz() {
            case "$1" in
              *AuthorizationFailed*|*"does not have authorization"*) echo "SEM PERMISSAO: a conta precisa ser Contributor ou Owner da assinatura." ;;
              *SpendingLimitReached*|*ReadOnlyDisabledSubscription*|*SubscriptionDisabled*|*PaymentRequired*) echo "SEM CREDITO: assinatura desativada ou com limite de gasto atingido." ;;
              *QuotaExceeded*|*"quota"*|*OperationNotAllowed*) echo "SEM COTA de vCPU na regiao $REG. Peca aumento em Uso + cotas." ;;
              *SkuNotAvailable*|*AllocationFailed*|*ZonalAllocationFailed*) echo "O Azure esta sem capacidade desse tamanho agora em $REG. Tente mais tarde." ;;
              *RequestDisallowedByPolicy*) echo "Uma politica da organizacao bloqueou a criacao." ;;
              *) echo "Erro do Azure: $(echo "$1" | tail -c 400)" ;;
            esac
          }
          # Script do primeiro boot do Windows (embutido neste arquivo; nao precisa de scripts/primeiro-boot.ps1)
          cat > /tmp/primeiro-boot.ps1 <<'PSEOF'
          # scripts/primeiro-boot.ps1
          # Roda UMA vez dentro do Windows 11, via "az vm run-command invoke", como SYSTEM.
          # A chave do Tailscale e a senha chegam por parametro e NUNCA sao gravadas em log.
          param(
            [Parameter(Mandatory = $true)][string]$AuthKey,
            [Parameter(Mandatory = $true)][string]$Senha,
            [string]$NomePC  = 'gamerpc',
            [string]$Usuario = 'Rafael',
            [string]$Tag     = 'tag:gamerpc'
          )

          $ErrorActionPreference = 'Stop'
          $ProgressPreference    = 'SilentlyContinue'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          New-Item -ItemType Directory -Force -Path C:\setup-logs | Out-Null
          $LogFile = 'C:\setup-logs\primeiro-boot.log'
          function Log($m) { "$(Get-Date -Format s) $m" | Out-File -FilePath $LogFile -Append -Encoding utf8 }
          Log 'Inicio (chave do Tailscale e senha nunca sao gravadas neste log)'

          $res = [ordered]@{
            usuario = $Usuario; conta_admin = $false; login_valido = $false
            tailscale_estado = 'nao instalado'; tailscale_ip = ''; tag_aplicada = $false
            sunshine = 'nao instalado'; erros = @()
          }
          function Falhou($etapa, $e) { $res.erros += "$etapa : $($e.Exception.Message)"; Log "ERRO em $etapa : $($e.Exception.Message)" }

          # ---------- 1) Conta do Windows: Rafael, administrador, senha gerada ----------
          try {
            $sec = ConvertTo-SecureString $Senha -AsPlainText -Force
            if (Get-LocalUser -Name $Usuario -ErrorAction SilentlyContinue) {
              Set-LocalUser -Name $Usuario -Password $sec -PasswordNeverExpires $true -AccountNeverExpires
              Enable-LocalUser -Name $Usuario
            } else {
              New-LocalUser -Name $Usuario -Password $sec -PasswordNeverExpires -AccountNeverExpires | Out-Null
            }
            $grpAdmin = (Get-LocalGroup -SID 'S-1-5-32-544').Name
            $grpRdp   = (Get-LocalGroup -SID 'S-1-5-32-555').Name
            Add-LocalGroupMember -Group $grpAdmin -Member $Usuario -ErrorAction SilentlyContinue
            Add-LocalGroupMember -Group $grpRdp   -Member $Usuario -ErrorAction SilentlyContinue
            $res.conta_admin = [bool](Get-LocalGroupMember -Group $grpAdmin | Where-Object { $_.Name -like "*\$Usuario" })

            Add-Type -AssemblyName System.DirectoryServices.AccountManagement
            $ctx = New-Object System.DirectoryServices.AccountManagement.PrincipalContext('Machine')
            $res.login_valido = [bool]$ctx.ValidateCredentials($Usuario, $Senha)
            Log "Conta $Usuario pronta (admin=$($res.conta_admin), login_valido=$($res.login_valido))"
          } catch { Falhou 'conta' $_ }

          # ---------- 2) Login automatico (o Sunshine precisa de uma sessao aberta) ----------
          try {
            $wl = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
            Set-ItemProperty -Path $wl -Name AutoAdminLogon    -Value '1'
            Set-ItemProperty -Path $wl -Name DefaultUserName   -Value $Usuario
            Set-ItemProperty -Path $wl -Name DefaultDomainName -Value $env:COMPUTERNAME
            Set-ItemProperty -Path $wl -Name DefaultPassword   -Value $Senha
            Log 'Login automatico configurado'
          } catch { Falhou 'autologon' $_ }

          # ---------- 3) Area de Trabalho Remota (reserva; acesso so pela rede Tailscale) ----------
          try {
            Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
            Enable-NetFirewallRule -DisplayGroup 'Remote Desktop' -ErrorAction SilentlyContinue
            Log 'RDP ligado'
          } catch { Falhou 'rdp' $_ }

          # ---------- 4) Tailscale: instalar, autenticar com TAILSCALE_AUTH_KEY, aguardar, achar o IP ----------
          try {
            $msi = 'C:\setup-logs\tailscale.msi'
            Invoke-WebRequest -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' -OutFile $msi
            Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /quiet /norestart" -Wait
            $ts = 'C:\Program Files\Tailscale\tailscale.exe'
            for ($i = 0; $i -lt 30 -and -not (Test-Path $ts); $i++) { Start-Sleep -Seconds 2 }
            if (-not (Test-Path $ts)) { throw 'Tailscale nao foi instalado' }
            Set-Service -Name Tailscale -StartupType Automatic      # inicia junto com o Windows
            Start-Service -Name Tailscale -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 5
            Log 'Tailscale instalado'

            & $ts up "--auth-key=$AuthKey" "--hostname=$NomePC" '--unattended' "--advertise-tags=$Tag" 2>&1 | Out-Null
            if ($LASTEXITCODE -eq 0) {
              $res.tag_aplicada = $true
            } else {
              Log "Tag $Tag nao autorizada por esta chave; tentando sem tag"
              & $ts up "--auth-key=$AuthKey" "--hostname=$NomePC" '--unattended' 2>&1 | Out-Null
              if ($LASTEXITCODE -ne 0) { throw 'tailscale up falhou (chave invalida, expirada ou ja usada?)' }
            }

            $estado = ''
            for ($i = 0; $i -lt 36; $i++) {                         # ate 3 minutos
              try { $estado = (& $ts status --json | ConvertFrom-Json).BackendState } catch { $estado = '' }
              if ($estado -eq 'Running') { break }
              Start-Sleep -Seconds 5
            }
            $res.tailscale_estado = if ($estado) { $estado } else { 'sem resposta' }
            $ip = (& $ts ip -4 2>$null | Select-Object -First 1)
            if ($ip) { $res.tailscale_ip = "$ip".Trim() }
            Log "Tailscale estado=$($res.tailscale_estado) ip=$($res.tailscale_ip)"
          } catch { Falhou 'tailscale' $_ }

          # ---------- 5) Sunshine (servidor de streaming para o Moonlight) ------
