name: PC gamer Windows 11 (Azure)
on:
  workflow_dispatch:
    inputs:
      acao:
        description: O que fazer
        type: choice
        options: [criar, status, ligar, desligar, reiniciar, destruir]
        default: criar
      tamanho:
        description: Tamanho (auto = GPU se houver cota, senao 16 GB sem GPU)
        type: choice
        options: [auto, Standard_NV6ads_A10_v5, Standard_D4s_v5]
        default: auto
permissions:
  contents: read
  id-token: write
env:
  RG: gamerpc-rg
  VM: gamerpc
  USUARIO: Rafael
  LOC: ${{ vars.AZ_LOCATION || 'eastus' }}
  REPO: ${{ github.repository }}
  BRANCH: ${{ github.ref_name }}
  ACAO: ${{ inputs.acao }}
  TAM_IN: ${{ inputs.tamanho }}
  AZ_CID: ${{ secrets.AZ_CLIENT_ID || vars.AZ_CLIENT_ID }}
  AZ_TID: ${{ secrets.AZ_TENANT_ID || vars.AZ_TENANT_ID }}
  AZ_SID: ${{ secrets.AZ_SUBSCRIPTION_ID || vars.AZ_SUBSCRIPTION_ID }}
jobs:
  pc:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # ---- 1) LOGIN NO AZURE: usa AZ_* se existirem ----
      - name: Login Azure (AZ_CLIENT_ID, AZ_TENANT_ID)
        if: env.AZ_CID != '' && env.AZ_TID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZ_CID }}
          tenant-id: ${{ env.AZ_TID }}
          subscription-id: ${{ env.AZ_SID }}
          allow-no-subscriptions: true

      # ---- 1b) SEM AZ_*: login por codigo (so na primeira vez) e cria AZ_* sozinho ----
      - name: Login Azure por codigo e criar AZ_CLIENT_ID / AZ_TENANT_ID
        if: env.AZ_CID == '' || env.AZ_TID == ''
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          logado=0
          for t in 1 2 3; do
            echo "::notice title=Login Azure::Tentativa $t de 3 - abra o link e digite o codigo mostrado neste passo"
            echo ">>> TENTATIVA $t de 3: abra o link abaixo e digite o codigo que aparecer <<<"
            az login --use-device-code -o none 2>&1 | tee /tmp/azlogin.log && rc=0 || rc=1
            if [ "$rc" = 0 ]; then logado=1; break; fi
            if grep -q "No subscriptions found" /tmp/azlogin.log; then
              echo "::error::Essa conta do Azure NAO tem assinatura. Crie uma em azure.com/free (ou entre com outra conta) e rode de novo."
              exit 1
            fi
            echo "Login nao concluido (codigo expirou ou foi recusado). Gerando outro..."
          done
          [ "$logado" = 1 ] || { echo "::error::Login no Azure nao concluido. Rode a acao de novo e entre no link logo que o codigo aparecer."; exit 1; }
          SUB=$(az account show --query id -o tsv)
          TEN=$(az account show --query tenantId -o tsv)
          NAME=gamerpc-gh
          APP=$(az ad app list --display-name "$NAME" --query "[0].appId" -o tsv)
          if [ -z "$APP" ]; then
            APP=$(az ad app create --display-name "$NAME" --query appId -o tsv)
          fi
          az ad sp show --id "$APP" -o none 2>/dev/null || az ad sp create --id "$APP" -o none
          ok=0
          for i in 1 2 3 4 5 6; do
            if az role assignment create --assignee "$APP" --role Contributor --scope "/subscriptions/$SUB" -o none 2>/dev/null; then ok=1; break; fi
            if [ -n "$(az role assignment list --assignee "$APP" --scope "/subscriptions/$SUB" --query '[0].id' -o tsv 2>/dev/null)" ]; then ok=1; break; fi
            sleep 15
          done
          [ "$ok" = 1 ] || { echo "::error::Sua conta precisa ser Owner da assinatura para dar a permissao Contributor."; exit 1; }
          CRED="gh-$(echo "$BRANCH" | sed 's/[^A-Za-z0-9-]/-/g')"
          SUBJ="repo:${REPO}:ref:refs/heads/${BRANCH}"
          if [ -z "$(az ad app federated-credential list --id "$APP" --query "[?name=='$CRED'].name" -o tsv)" ]; then
            az ad app federated-credential create --id "$APP" -o none --parameters "$(jq -nc --arg n "$CRED" --arg s "$SUBJ" \
              '{name:$n,issuer:"https://token.actions.githubusercontent.com",subject:$s,audiences:["api://AzureADTokenExchange"]}')"
          fi
          SALVO="nao"
          if [ -n "${GH_TOKEN:-}" ]; then
            gh secret set AZ_CLIENT_ID --body "$APP" --repo "$REPO"
            gh secret set AZ_TENANT_ID --body "$TEN" --repo "$REPO"
            gh secret set AZ_SUBSCRIPTION_ID --body "$SUB" --repo "$REPO"
            SALVO="sim"
          fi
          {
            echo "## Valores criados do Azure"
            echo "| Segredo | Valor |"; echo "|---|---|"
            echo "| AZ_CLIENT_ID | \`$APP\` |"
            echo "| AZ_TENANT_ID | \`$TEN\` |"
            echo "| AZ_SUBSCRIPTION_ID | \`$SUB\` |"
            echo ""
            if [ "$SALVO" = sim ]; then
              echo "Salvos como secrets do repositorio. Nas proximas execucoes nao pede mais codigo."
            else
              echo "Crie estes 3 como **Secrets** do repositorio para nao pedir codigo nas proximas execucoes."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ---- 2) VERIFICAR ASSINATURA ----
      - name: Verificar assinatura do Azure
        run: |
          set -uo pipefail
          falha() { echo "::error::$1"; { echo "## Nao foi possivel continuar"; echo ""; echo "$1"; } >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          TOTAL=$(az account list --all --query "length(@)" -o tsv 2>/dev/null || echo 0)
          ATIVAS=$(az account list --all --query "[?state=='Enabled'] | length(@)" -o tsv 2>/dev/null || echo 0)
          if [ "${TOTAL:-0}" = 0 ]; then
            falha "FALTA ASSINATURA: essa conta do Azure nao tem nenhuma assinatura. O Azure exige cadastro (com cartao para verificacao) em azure.com/free. O workflow nao consegue criar isso por voce."
          fi
          if [ "${ATIVAS:-0}" = 0 ]; then
            ESTADOS=$(az account list --all --query "[].state" -o tsv | sort -u | tr '\n' ' ')
            falha "ASSINATURA SEM USO: existe, mas nao esta ativa (estado: $ESTADOS). Isso costuma indicar credito acabado, teste gratuito expirado ou pagamento pendente. Resolva em portal.azure.com > Assinaturas."
          fi
          SUB="${AZ_SID:-}"
          if [ -z "$SUB" ]; then
            SUB=$(az account list --all --query "[?state=='Enabled'] | [0].id" -o tsv)
          fi
          az account set --subscription "$SUB" 2>/tmp/err || falha "A assinatura $SUB nao esta acessivel por esta conta/app. Detalhe: $(head -c 300 /tmp/err)"
          NOME=$(az account show --query name -o tsv)
          echo "Assinatura em uso: $NOME"
          echo "ASSINATURA=$NOME" >> "$GITHUB_ENV"

      # ---- 3) PREPARAR: provedores, regiao, GPU e cota ----
      - name: Preparar recursos e verificar GPU / cota
        id: prep
        if: inputs.acao == 'criar'
        env:
          AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          set -uo pipefail
          falha() { echo "::error::$1"; { echo "## Nao foi possivel criar o PC"; echo ""; echo "$1"; } >> "$GITHUB_STEP_SUMMARY"; exit 1; }

          if [ -z "$AUTHKEY" ]; then
            falha "FALTA O SECRET TAILSCALE_AUTH_KEY. Crie em Settings > Secrets and variables > Actions e rode de novo."
          fi

          for P in Microsoft.Compute Microsoft.Network Microsoft.Storage; do
            az provider register --namespace "$P" --wait -o none 2>/tmp/err \
              || falha "SEM PERMISSAO para ativar o provedor $P. A conta/app precisa ser Contributor ou Owner da assinatura. Detalhe: $(head -c 300 /tmp/err)"
          done

          if az vm show -g "$RG" -n "$VM" -o none 2>/dev/null; then
            falha "O PC $VM ja existe. Rode a acao destruir antes de criar de novo."
          fi

          OUTRAS="eastus eastus2 westus2 westus3 southcentralus centralus westeurope northeurope"
          MOTIVOS=""

          livre() {
            echo "$1" | jq -r --arg f "$2" '[.[] | select((.name.value | ascii_downcase) == ($f | ascii_downcase)) | ((.limit | tonumber) - (.currentValue | tonumber))] | .[0] // 0' 2>/dev/null || echo 0
          }

          # checa REGIAO TAMANHO FAMILIA VCPUS
          checa() {
            local R="$1" S="$2" F="$3" V="$4" N RS U FAM TOT
            N=$(az vm list-skus -l "$R" --size "$S" --resource-type virtualMachines --query "length(@)" -o tsv 2>/dev/null || echo 0)
            if [ "${N:-0}" -le 0 ]; then MOTIVOS+=$'\n'"- $S nao e oferecido em $R"; return 1; fi
            RS=$(az vm list-skus -l "$R" --size "$S" --resource-type virtualMachines --query "[0].restrictions | length(@)" -o tsv 2>/dev/null || echo 0)
            if [ "${RS:-0}" != 0 ]; then MOTIVOS+=$'\n'"- $S esta bloqueado para esta assinatura em $R"; return 1; fi
            U=$(az vm list-usage -l "$R" -o json 2>/dev/null || echo '[]')
            FAM=$(livre "$U" "$F"); TOT=$(livre "$U" cores)
            if [ "${FAM:-0}" -lt "$V" ]; then MOTIVOS+=$'\n'"- $S em $R: cota da familia $F = ${FAM:-0} vCPU livres (precisa de $V)"; return 1; fi
            if [ "${TOT:-0}" -lt "$V" ]; then MOTIVOS+=$'\n'"- $S em $R: cota total de vCPU = ${TOT:-0} livres (precisa de $V)"; return 1; fi
            return 0
          }

          ESC=""; REG=""; AVISO=""
          if [ "$TAM_IN" != "Standard_D4s_v5" ]; then
            for R in $LOC $OUTRAS; do
              if checa "$R" Standard_NV6ads_A10_v5 standardNVadsA10v5Family 6; then ESC=Standard_NV6ads_A10_v5; REG="$R"; break; fi
            done
            if [ -z "$ESC" ] && [ "$TAM_IN" = "Standard_NV6ads_A10_v5" ]; then
              falha "SEM COTA/DISPONIBILIDADE DE GPU NVIDIA (A10) em nenhuma regiao testada.$MOTIVOS"$'\n\n'"Para liberar: portal.azure.com > Assinaturas > Uso + cotas, filtre por NVadsA10v5 e peca 6 vCPU. Contas de teste gratuito costumam nao permitir GPU e podem exigir plano pago. O workflow nao pode aprovar cota por voce."
            fi
          fi
          if [ -z "$ESC" ]; then
            GPUMOT="$MOTIVOS"; MOTIVOS=""
            for R in $LOC $OUTRAS; do
              if checa "$R" Standard_D4s_v5 standardDSv5Family 4; then ESC=Standard_D4s_v5; REG="$R"; break; fi
            done
            if [ -z "$ESC" ]; then
              falha "SEM COTA DE vCPU para criar o PC.$GPUMOT$MOTIVOS"$'\n\n'"Peca aumento em portal.azure.com > Assinaturas > Uso + cotas. O workflow nao pode aprovar cota por voce."
            fi
            if [ "$TAM_IN" != "Standard_D4s_v5" ]; then
              AVISO="Sem GPU: a conta nao tem cota/disponibilidade da NVIDIA A10.$GPUMOT"
            fi
          fi

          if [ "$ESC" = Standard_NV6ads_A10_v5 ]; then RAM="55 GB (menor tamanho com GPU A10; nao existe A10 com 16 GB)"; GPU="NVIDIA A10 (fracao de 1/6)"; else RAM="16 GB"; GPU="sem GPU"; fi
          echo "Escolhido: $ESC em $REG"
          echo "regiao=$REG" >> "$GITHUB_OUTPUT"
          echo "tamanho=$ESC" >> "$GITHUB_OUTPUT"
          echo "ram=$RAM" >> "$GITHUB_OUTPUT"
          echo "gpu=$GPU" >> "$GITHUB_OUTPUT"
          echo "aviso=$(echo "$AVISO" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      # ---- 4) CRIAR O PC ----
      - name: Criar o PC (VM real no Azure)
        id: criar
        if: inputs.acao == 'criar'
        env:
          AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          TAM: ${{ steps.prep.outputs.tamanho }}
          REG: ${{ steps.prep.outputs.regiao }}
        run: |
          set -uo pipefail
          falha() { echo "::error::$1"; { echo "## Nao foi possivel criar o PC"; echo ""; echo "$1"; } >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          traduz() {
            case "$1" in
              *AuthorizationFailed*|*"does not have authorization"*) echo "SEM PERMISSAO: a conta/app precisa ser Contributor ou Owner da assinatura." ;;
              *SpendingLimitReached*|*ReadOnlyDisabledSubscription*|*SubscriptionDisabled*|*"subscription is disabled"*|*PaymentRequired*) echo "SEM CREDITO: assinatura desativada ou com limite de gasto atingido. Veja portal.azure.com > Assinaturas > Cost Management." ;;
              *QuotaExceeded*|*"quota"*|*OperationNotAllowed*) echo "SEM COTA de vCPU na regiao $REG. Peca aumento em portal.azure.com > Assinaturas > Uso + cotas." ;;
              *SkuNotAvailable*|*AllocationFailed*|*ZonalAllocationFailed*) echo "O Azure esta sem capacidade desse tamanho agora em $REG. Tente de novo mais tarde." ;;
              *RequestDisallowedByPolicy*) echo "Uma politica da organizacao bloqueou a criacao." ;;
              *) echo "Erro do Azure: $(echo "$1" | tail -c 400)" ;;
            esac
          }
          echo "::add-mask::$AUTHKEY"

          # Script que roda dentro do Windows (sem nenhum segredo dentro)
          cat > /tmp/primeiro-boot.ps1 <<'PSEOF'
          param(
            [Parameter(Mandatory = $true)][string]$AuthKey,
            [Parameter(Mandatory = $true)][string]$Senha,
            [string]$NomePC = 'gamerpc',
            [string]$Usuario = 'Rafael'
          )

          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          New-Item -ItemType Directory -Force -Path C:\setup-logs | Out-Null
          $LogFile = 'C:\setup-logs\primeiro-boot.log'
          function Log($m) { "$(Get-Date -Format s) $m" | Out-File -FilePath $LogFile -Append -Encoding utf8 }
          Log "Inicio do primeiro boot (a chave do Tailscale nunca e gravada neste log)"

          # 1) Conta Windows
          $sec = ConvertTo-SecureString $Senha -AsPlainText -Force
          if (Get-LocalUser -Name $Usuario -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name $Usuario -Password $sec -PasswordNeverExpires $true
          } else {
            New-LocalUser -Name $Usuario -Password $sec -PasswordNeverExpires -AccountNeverExpires | Out-Null
          }
          Add-LocalGroupMember -Group 'Administrators' -Member $Usuario -ErrorAction SilentlyContinue
          Log "Conta $Usuario pronta"

          # 2) Login automatico (o Sunshine precisa de uma sessao aberta para transmitir)
          $wl = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
          Set-ItemProperty -Path $wl -Name AutoAdminLogon -Value '1'
          Set-ItemProperty -Path $wl -Name DefaultUserName -Value $Usuario
          Set-ItemProperty -Path $wl -Name DefaultPassword -Value $Senha
          Set-ItemProperty -Path $wl -Name DefaultDomainName -Value $env:COMPUTERNAME

          # 3) Energia: sem suspensao e sem desligar tela/disco
          powercfg /setactive SCHEME_MIN | Out-Null
          powercfg /change standby-timeout-ac 0
          powercfg /change monitor-timeout-ac 0
          powercfg /change disk-timeout-ac 0
          powercfg /hibernate off

          # 4) Tailscale: instala e autentica com a chave do GitHub Secret
          $msi = 'C:\setup-logs\tailscale.msi'
          Invoke-WebRequest -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' -OutFile $msi -UseBasicParsing
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /quiet /norestart" -Wait -PassThru
          if ($p.ExitCode -notin 0, 3010) { throw "Falha ao instalar o Tailscale (codigo $($p.ExitCode))" }
          $ts = 'C:\Program Files\Tailscale\tailscale.exe'
          for ($i = 0; $i -lt 30 -and -not (Test-Path $ts); $i++) { Start-Sleep 2 }
          Start-Service -Name Tailscale -ErrorAction SilentlyContinue
          Start-Sleep 5

          & $ts up "--auth-key=$AuthKey" "--hostname=$NomePC" --unattended --reset *> $null
          if ($LASTEXITCODE -ne 0) { throw "tailscale up falhou (codigo $LASTEXITCODE). Verifique se TAILSCALE_AUTH_KEY e valida e nao expirou." }
          $AuthKey = $null

          $ip = $null
          for ($i = 0; $i -lt 60 -and -not $ip; $i++) {
            try {
              $st = (& $ts status --json | ConvertFrom-Json)
              if ($st.BackendState -eq 'Running') { $ip = (& $ts ip -4 | Select-Object -First 1) }
            } catch {}
            if (-not $ip) { Start-Sleep 5 }
          }
          if (-not $ip) { throw 'O Tailscale nao conectou a tempo.' }
          Log "Tailscale conectado: $ip"

          # 5) Sunshine (servidor de streaming para o Moonlight)
          $rel = Invoke-RestMethod -Uri 'https://api.github.com/repos/LizardByte/Sunshine/releases/latest' -Headers @{ 'User-Agent' = 'gamerpc' }
          $asset = $rel.assets | Where-Object { $_.name -match 'windows' -and $_.name -match 'installer\.exe$' -and $_.name -notmatch 'arm' } | Select-Object -First 1
          if (-not $asset) { throw 'Instalador do Sunshine nao encontrado.' }
          $exe = 'C:\setup-logs\sunshine-installer.exe'
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $exe -UseBasicParsing
          $p = Start-Process $exe -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Log "Aviso: instalador do Sunshine retornou $($p.ExitCode)" }

          New-NetFirewallRule -DisplayName 'Sunshine TCP' -Direction Inbound -Protocol TCP -LocalPort 47984, 47989, 47990, 48010 -Action Allow -ErrorAction SilentlyContinue | Out-Null
          New-NetFirewallRule -DisplayName 'Sunshine UDP' -Direction Inbound -Protocol UDP -LocalPort 47998, 47999, 48000, 48002, 48010 -Action Allow -ErrorAction SilentlyContinue | Out-Null
          Log "Sunshine instalado"

          # Login do Sunshine = mesma conta do Windows (evita criar usuario no painel)
          $sun = 'C:\Program Files\Sunshine\sunshine.exe'
          if (Test-Path $sun) {
            try {
              Push-Location 'C:\Program Files\Sunshine'
              & $sun --creds $Usuario $Senha *> $null
              Pop-Location
              Restart-Service -Name SunshineService -ErrorAction SilentlyContinue
              Log "Login do Sunshine definido"
            } catch { Log "Aviso: nao foi possivel definir o login do Sunshine" }
          }

          Log "Primeiro boot concluido"
          PSEOF

          # Senha NAO e mascarada de proposito: ela aparece no resumo final
          PW="$(openssl rand -base64 12 | tr '+/' '-_')aA1!"
          echo "pw=$PW" >> "$GITHUB_OUTPUT"

          if [ "$(az group exists -n "$RG")" = true ]; then az group delete -n "$RG" --yes -o none 2>/dev/null; fi
          az group create -n "$RG" -l "$REG" -o none 2>/tmp/err || falha "$(traduz "$(cat /tmp/err)")"

          az vm create -g "$RG" -n "$VM" --computer-name GAMERPC --size "$TAM" \
            --image MicrosoftWindowsDesktop:windows-11:win11-24h2-ent:latest \
            --admin-username "$USUARIO" --admin-password "$PW" \
            --os-disk-size-gb 240 --storage-sku Premium_LRS --license-type Windows_Client \
            --public-ip-sku Standard --nsg-rule NONE \
            --custom-data /tmp/primeiro-boot.ps1 -o none 2>/tmp/err || falha "$(traduz "$(cat /tmp/err)")"

          if [[ "$TAM" == *NV* ]]; then
            az vm extension set -g "$RG" --vm-name "$VM" --publisher Microsoft.HpcCompute \
              --name NvidiaGpuDriverWindows --version 1.6 -o none 2>/tmp/err \
              || echo "::warning::Driver NVIDIA nao instalou: $(tail -c 300 /tmp/err)"
          fi

          # A chave e a senha vao em protected-settings (criptografado, nao aparece em logs nem no portal)
          CMD="powershell -ExecutionPolicy Bypass -Command \"Copy-Item C:\\AzureData\\CustomData.bin C:\\setup.ps1 -Force; & C:\\setup.ps1 -AuthKey '$AUTHKEY' -NomePC '$VM' -Usuario '$USUARIO' -Senha '$PW'\""
          PS=$(jq -nc --arg c "$CMD" '{commandToExecute:$c}')
          echo "::add-mask::$PS"
          az vm extension set -g "$RG" --vm-name "$VM" --publisher Microsoft.Compute \
            --name CustomScriptExtension --version 1.10 \
            --protected-settings "$PS" -o none 2>/tmp/err \
            || falha "O script de primeiro boot falhou dentro do Windows. A causa mais comum e TAILSCALE_AUTH_KEY invalida ou expirada (gere outra no painel do Tailscale). Logs na VM: C:\\setup-logs\\primeiro-boot.log"

      # ---- 5) LIGAR / DESLIGAR / REINICIAR / DESTRUIR ----
      - name: Ligar, desligar, reiniciar ou destruir
        if: contains('ligar desligar 
