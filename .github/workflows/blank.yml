name: PC gamer Windows 11 (Azure)
on:
  workflow_dispatch:
    inputs:
      acao:
        description: O que fazer
        type: choice
        options: [criar, status, ligar, desligar, reiniciar, destruir]
        default: criar
      tamanho:
        description: Tamanho (auto = GPU se houver cota, senao 16 GB sem GPU)
        type: choice
        options: [auto, Standard_NV6ads_A10_v5, Standard_D4s_v5]
        default: auto
permissions:
  contents: read
  id-token: write
env:
  RG: gamerpc-rg
  VM: gamerpc
  USUARIO: Rafael
  LOC: ${{ vars.AZ_LOCATION || 'eastus' }}
  REPO: ${{ github.repository }}
  BRANCH: ${{ github.ref_name }}
  ACAO: ${{ inputs.acao }}
  TAM_IN: ${{ inputs.tamanho }}
  AZ_CID: ${{ secrets.AZ_CLIENT_ID || vars.AZ_CLIENT_ID }}
  AZ_TID: ${{ secrets.AZ_TENANT_ID || vars.AZ_TENANT_ID }}
  AZ_SID: ${{ secrets.AZ_SUBSCRIPTION_ID || vars.AZ_SUBSCRIPTION_ID }}
jobs:
  pc:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # ---- 1) LOGIN NO AZURE: usa AZ_* se existirem ----
      - name: Login Azure (AZ_CLIENT_ID, AZ_TENANT_ID)
        if: env.AZ_CID != '' && env.AZ_TID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZ_CID }}
          tenant-id: ${{ env.AZ_TID }}
          subscription-id: ${{ env.AZ_SID }}
          allow-no-subscriptions: true

      # ---- 1b) SEM AZ_*: login por codigo (so na primeira vez); espera a assinatura; cria AZ_* sozinho ----
      - name: Login Azure por codigo, aguardar assinatura e criar AZ_CLIENT_ID / AZ_TENANT_ID
        if: env.AZ_CID == '' || env.AZ_TID == ''
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: |
          set -uo pipefail
          falha() { echo "::error::$1"; { echo "## Nao foi possivel continuar"; echo ""; echo "$1"; } >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          FILTRO="!starts_with(name,'N/A(tenant')"

          logado=0
          for t in 1 2 3; do
            echo "::notice title=Login Azure::Tentativa $t de 3 - abra o link e digite o codigo mostrado neste passo"
            echo ">>> TENTATIVA $t de 3: abra o link abaixo e digite o codigo que aparecer <<<"
            az login --use-device-code --allow-no-subscriptions -o none 2>&1 | tee /tmp/azlogin.log && rc=0 || rc=1
            if [ "$rc" = 0 ]; then logado=1; break; fi
            echo "Login nao concluido (codigo expirou ou foi recusado). Gerando outro..."
          done
          [ "$logado" = 1 ] || falha "LOGIN NAO CONCLUIDO. Rode a acao de novo e entre no link logo que o codigo aparecer."

          CONTA=$(az account show --query user.name -o tsv 2>/dev/null)
          conta_total() { az account list --all --refresh --query "[?$FILTRO] | length(@)" -o tsv 2>/dev/null || echo 0; }
          conta_ativas() { az account list --all --refresh --query "[?state=='Enabled' && $FILTRO] | length(@)" -o tsv 2>/dev/null || echo 0; }

          if [ "$(conta_total)" = 0 ]; then
            {
              echo "## FALTA ASSINATURA DO AZURE"
              echo ""
              echo "A conta **$CONTA** entrou no Azure, mas ainda nao tem assinatura. O workflow NAO cria assinatura por voce: o cadastro e feito por voce, com a Microsoft."
              echo ""
              echo "1. Abra https://azure.microsoft.com/free e toque em **Comece gratuitamente**."
              echo "2. Entre com o MESMO e-mail: **$CONTA**."
              echo "3. Preencha os dados, confirme o telefone e o cartao (a Microsoft usa o cartao so para verificar a identidade)."
              echo "4. Quando terminar, volte aqui. Este workflow fica verificando a cada 30 segundos, por ate 30 minutos, e continua sozinho quando a assinatura aparecer."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Falta assinatura::Crie a assinatura em https://azure.microsoft.com/free com o e-mail $CONTA. O workflow aguarda ate 30 minutos."
            echo "FALTA ASSINATURA. Crie em https://azure.microsoft.com/free com o e-mail $CONTA. Aguardando..."
            for i in $(seq 1 60); do
              sleep 30
              [ "$(conta_total)" != 0 ] && break
              echo "Aguardando a assinatura... ($i de 60)"
            done
            [ "$(conta_total)" != 0 ] || falha "ASSINATURA NAO APARECEU em 30 minutos. Termine o cadastro em https://azure.microsoft.com/free com o e-mail $CONTA e rode a acao de novo."
          fi

          if [ "$(conta_ativas)" = 0 ]; then
            for i in $(seq 1 20); do
              sleep 30
              [ "$(conta_ativas)" != 0 ] && break
              echo "Assinatura ainda sendo ativada... ($i de 20)"
            done
          fi
          [ "$(conta_ativas)" != 0 ] || falha "ASSINATURA NAO ESTA ATIVA (estado: $(az account list --all --query "[?$FILTRO].state" -o tsv | sort -u | tr '\n' ' ')). Credito acabado, pagamento pendente ou ativacao em andamento. Veja portal.azure.com > Assinaturas."

          SUB=$(az account list --all --query "[?state=='Enabled' && $FILTRO] | [0].id" -o tsv)
          az account set --subscription "$SUB"
          TEN=$(az account show --query tenantId -o tsv)
          NAME=gamerpc-gh
          APP=$(az ad app list --display-name "$NAME" --query "[0].appId" -o tsv)
          if [ -z "$APP" ]; then
            APP=$(az ad app create --display-name "$NAME" --query appId -o tsv)
          fi
          az ad sp show --id "$APP" -o none 2>/dev/null || az ad sp create --id "$APP" -o none
          ok=0
          for i in 1 2 3 4 5 6; do
            if az role assignment create --assignee "$APP" --role Contributor --scope "/subscriptions/$SUB" -o none 2>/dev/null; then ok=1; break; fi
            if [ -n "$(az role assignment list --assignee "$APP" --scope "/subscriptions/$SUB" --query '[0].id' -o tsv 2>/dev/null)" ]; then ok=1; break; fi
            sleep 15
          done
          [ "$ok" = 1 ] || falha "SEM PERMISSAO: sua conta precisa ser Owner da assinatura para dar o papel Contributor ao app do GitHub."
          CRED="gh-$(echo "$BRANCH" | sed 's/[^A-Za-z0-9-]/-/g')"
          SUBJ="repo:${REPO}:ref:refs/heads/${BRANCH}"
          if [ -z "$(az ad app federated-credential list --id "$APP" --query "[?name=='$CRED'].name" -o tsv)" ]; then
            az ad app federated-credential create --id "$APP" -o none --parameters "$(jq -nc --arg n "$CRED" --arg s "$SUBJ" \
              '{name:$n,issuer:"https://token.actions.githubusercontent.com",subject:$s,audiences:["api://AzureADTokenExchange"]}')"
          fi
          SALVO="nao"
          if [ -n "${GH_TOKEN:-}" ]; then
            gh secret set AZ_CLIENT_ID --body "$APP" --repo "$REPO"
            gh secret set AZ_TENANT_ID --body "$TEN" --repo "$REPO"
            gh secret set AZ_SUBSCRIPTION_ID --body "$SUB" --repo "$REPO"
            SALVO="sim"
          fi
          {
            echo "## Valores criados do Azure"
            echo "| Segredo | Valor |"; echo "|---|---|"
            echo "| AZ_CLIENT_ID | \`$APP\` |"
            echo "| AZ_TENANT_ID | \`$TEN\` |"
            echo "| AZ_SUBSCRIPTION_ID | \`$SUB\` |"
            echo ""
            if [ "$SALVO" = sim ]; then
              echo "Salvos como secrets do repositorio. Nas proximas execucoes nao pede mais codigo."
            else
              echo "Crie estes 3 como **Secrets** do repositorio para nao pedir codigo nas proximas execucoes."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ---- 2) VERIFICAR ASSINATURA, ESTADO, OFERTA E PERMISSOES ----
      - name: Verificar assinatura, estado, oferta e permissoes
        run: |
          set -uo pipefail
          falha() { echo "::error::$1"; { echo "## Nao foi possivel continuar"; echo ""; echo "$1"; } >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          FILTRO="!starts_with(name,'N/A(tenant')"
          az account list --all --refresh -o none 2>/dev/null
          CONTA=$(az account show --query user.name -o tsv 2>/dev/null || echo "?")
          TOTAL=$(az account list --all --query "[?$FILTRO] | length(@)" -o tsv 2>/dev/null || echo 0)
          ATIVAS=$(az account list --all --query "[?state=='Enabled' && $FILTRO] | length(@)" -o tsv 2>/dev/null || echo 0)

          if [ "${TOTAL:-0}" = 0 ]; then
            if [ -n "${AZ_CID:-}" ]; then
              falha "O app do Azure (AZ_CLIENT_ID) nao enxerga nenhuma assinatura. Se a assinatura ainda nao existe, crie em https://azure.microsoft.com/free. Se ja existe, o dono precisa dar o papel Contributor ao app gamerpc-gh, ou voce apaga os Secrets AZ_* para o workflow refazer a configuracao pelo login por codigo."
            fi
            falha "FALTA ASSINATURA: a conta $CONTA nao tem assinatura. Crie em https://azure.microsoft.com/free com esse e-mail e rode de novo."
          fi
          if [ "${ATIVAS:-0}" = 0 ]; then
            ESTADOS=$(az account list --all --query "[?$FILTRO].state" -o tsv | sort -u | tr '\n' ' ')
            falha "ASSINATURA NAO ESTA ATIVA (estado: $ESTADOS). Isso costuma ser credito acabado, teste gratuito expirado ou pagamento pendente. O dono da conta precisa resolver em portal.azure.com > Assinaturas."
          fi

          SUB="${AZ_SID:-}"
          if [ -z "$SUB" ]; then
            SUB=$(az account list --all --query "[?state=='Enabled' && $FILTRO] | [0].id" -o tsv)
          fi
          az account set --subscription "$SUB" 2>/tmp/err || falha "A assinatura informada nao esta acessivel por esta conta/app. Detalhe: $(head -c 300 /tmp/err)"
          NOME=$(az account show --query name -o tsv)

          # Oferta (tipo de assinatura) e limite de gasto
          INFO=$(az rest --method get --url "https://management.azure.com/subscriptions/$SUB?api-version=2020-01-01" -o json 2>/dev/null || echo '{}')
          QUOTA=$(echo "$INFO" | jq -r '.subscriptionPolicies.quotaId // "desconhecida"')
          LIMITE=$(echo "$INFO" | jq -r '.subscriptionPolicies.spendingLimit // "desconhecido"')
          CREDITO="o Azure nao informa o saldo por API: confira em portal.azure.com > Assinaturas > Cost Management"
          NOTA=""
          case "$QUOTA" in
            FreeTrial*) NOTA="Teste gratuito: o credito e limitado e a GPU NVIDIA normalmente fica bloqueada. Para usar GPU, o dono precisa fazer Upgrade para pagamento conforme o uso no portal." ;;
          esac
          if [ "$LIMITE" = "On" ]; then NOTA="$NOTA Limite de gasto ativado: alguns tamanhos de VM podem ser bloqueados."; fi

          # Permissao para criar maquinas virtuais
          PERM=$(az rest --method get --url "https://management.azure.com/subscriptions/$SUB/providers/Microsoft.Authorization/permissions?api-version=2022-04-01" --query "value[].actions[]" -o tsv 2>/dev/null || true)
          if [ -z "$PERM" ]; then
            PODE="nao foi possivel verificar (sera testado ao criar)"
          elif echo "$PERM" | grep -qxE '\*|Microsoft\.Compute/\*|Microsoft\.Compute/virtualMachines/write'; then
            PODE="sim"
          else
            PODE="nao"
          fi
          if [ "$PODE" = "nao" ]; then
            falha "SEM PERMISSAO PARA CRIAR MAQUINAS VIRTUAIS em $NOME. O dono da assinatura precisa dar o papel Contributor (ou Owner) para $CONTA em portal.azure.com > Assinaturas > Controle de acesso (IAM)."
          fi

          echo "Assinatura em uso: $NOME"
          echo "ASSINATURA=$NOME" >> "$GITHUB_ENV"
          echo "OFERTA=$QUOTA" >> "$GITHUB_ENV"
          {
            echo "## VERIFICACAO DA ASSINATURA"
            echo "| Item | Valor |"; echo "|---|---|"
            echo "| Conta autenticada | $CONTA |"
            echo "| Assinatura | $NOME |"
            echo "| ID da assinatura | \`$SUB\` |"
            echo "| Estado | Enabled (ativa) |"
            echo "| Tipo de oferta | $QUOTA |"
            echo "| Limite de gasto | $LIMITE |"
            echo "| Pode criar VMs | $PODE |"
            echo "| Creditos | $CREDITO |"
            if [ -n "$NOTA" ]; then echo ""; echo "**Atencao:** $NOTA"; fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      # ---- 3) PREPARAR: provedores, regiao, GPU e cota ----
      - name: Preparar recursos e verificar GPU / cota
        id: prep
        if: inputs.acao == 'criar'
        env:
          AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          set -uo pipefail
          falha() { echo "::error::$1"; { echo "## Nao foi possivel criar o PC"; echo ""; echo "$1"; } >> "$GITHUB_STEP_SUMMARY"; exit 1; }

          if [ -z "$AUTHKEY" ]; then
            falha "FALTA O SECRET TAILSCALE_AUTH_KEY. Crie em Settings > Secrets and variables > Actions e rode de novo."
          fi

          for P in Microsoft.Compute Microsoft.Network Microsoft.Storage; do
            az provider register --namespace "$P" --wait -o none 2>/tmp/err \
              || falha "SEM PERMISSAO para ativar o provedor $P. A conta/app precisa ser Contributor ou Owner da assinatura. Detalhe: $(head -c 300 /tmp/err)"
          done

          if az vm show -g "$RG" -n "$VM" -o none 2>/dev/null; then
            falha "O PC $VM ja existe. Rode a acao destruir antes de criar de novo."
          fi

          OUTRAS="eastus eastus2 westus2 westus3 southcentralus centralus westeurope northeurope"
          MOTIVOS=""

          livre() {
            echo "$1" | jq -r --arg f "$2" '[.[] | select((.name.value | ascii_downcase) == ($f | ascii_downcase)) | ((.limit | tonumber) - (.currentValue | tonumber))] | .[0] // 0' 2>/dev/null || echo 0
          }

          # checa REGIAO TAMANHO FAMILIA VCPUS
          checa() {
            local R="$1" S="$2" F="$3" V="$4" N RS U FAM TOT
            N=$(az vm list-skus -l "$R" --size "$S" --resource-type virtualMachines --query "length(@)" -o tsv 2>/dev/null || echo 0)
            if [ "${N:-0}" -le 0 ]; then MOTIVOS+=$'\n'"- $S nao e oferecido em $R"; return 1; fi
            RS=$(az vm list-skus -l "$R" --size "$S" --resource-type virtualMachines --query "[0].restrictions | length(@)" -o tsv 2>/dev/null || echo 0)
            if [ "${RS:-0}" != 0 ]; then MOTIVOS+=$'\n'"- $S esta bloqueado para esta assinatura em $R"; return 1; fi
            U=$(az vm list-usage -l "$R" -o json 2>/dev/null || echo '[]')
            FAM=$(livre "$U" "$F"); TOT=$(livre "$U" cores)
            if [ "${FAM:-0}" -lt "$V" ]; then MOTIVOS+=$'\n'"- $S em $R: cota da familia $F = ${FAM:-0} vCPU livres (precisa de $V)"; return 1; fi
            if [ "${TOT:-0}" -lt "$V" ]; then MOTIVOS+=$'\n'"- $S em $R: cota total de vCPU = ${TOT:-0} livres (precisa de $V)"; return 1; fi
            return 0
          }

          ESC=""; REG=""; AVISO=""
          if [ "$TAM_IN" != "Standard_D4s_v5" ]; then
            for R in $LOC $OUTRAS; do
              if checa "$R" Standard_NV6ads_A10_v5 standardNVadsA10v5Family 6; then ESC=Standard_NV6ads_A10_v5; REG="$R"; break; fi
            done
            if [ -z "$ESC" ] && [ "$TAM_IN" = "Standard_NV6ads_A10_v5" ]; then
              falha "SEM COTA/DISPONIBILIDADE DE GPU NVIDIA (A10) em nenhuma regiao testada.$MOTIVOS"$'\n\n'"Para liberar: portal.azure.com > Assinaturas > Uso + cotas, filtre por NVadsA10v5 e peca 6 vCPU. Contas de teste gratuito costumam nao permitir GPU e podem exigir plano pago. O workflow nao pode aprovar cota por voce."
            fi
          fi
          if [ -z "$ESC" ]; then
            GPUMOT="$MOTIVOS"; MOTIVOS=""
            for R in $LOC $OUTRAS; do
              if checa "$R" Standard_D4s_v5 standardDSv5Family 4; then ESC=Standard_D4s_v5; REG="$R"; break; fi
            done
            if [ -z "$ESC" ]; then
              falha "SEM COTA DE vCPU para criar o PC.$GPUMOT$MOTIVOS"$'\n\n'"Peca aumento em portal.azure.com > Assinaturas > Uso + cotas. O workflow nao pode aprovar cota por voce."
            fi
            if [ "$TAM_IN" != "Standard_D4s_v5" ]; then
              AVISO="Sem GPU: a conta nao tem cota/disponibilidade da NVIDIA A10.$GPUMOT"
            fi
          fi

          if [ "$ESC" = Standard_NV6ads_A10_v5 ]; then RAM="55 GB (menor tamanho com GPU A10; nao existe A10 com 16 GB)"; GPU="NVIDIA A10 (fracao de 1/6)"; else RAM="16 GB"; GPU="sem GPU"; fi
          echo "Escolhido: $ESC em $REG"
          echo "regiao=$REG" >> "$GITHUB_OUTPUT"
          echo "tamanho=$ESC" >> "$GITHUB_OUTPUT"
          echo "ram=$RAM" >> "$GITHUB_OUTPUT"
          echo "gpu=$GPU" >> "$GITHUB_OUTPUT"
          echo "aviso=$(echo "$AVISO" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      # ---- 4) CRIAR O PC ----
      - name: Criar o PC (VM real no Azure)
        id: criar
        if: inputs.acao == 'criar'
        env:
          AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          TAM: ${{ steps.prep.outputs.tamanho }}
          REG: ${{ steps.prep.outputs.regiao }}
        run: |
          set -uo pipefail
          falha() { echo "::error::$1"; { echo "## Nao foi possivel criar o PC"; echo ""; echo "$1"; } >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          traduz() {
            case "$1" in
              *AuthorizationFailed*|*"does not have authorization"*) echo "SEM PERMISSAO: a conta/app precisa ser Contributor ou Owner da assinatura." ;;
              *SpendingLimitReached*|*ReadOnlyDisabledSubscription*|*SubscriptionDisabled*|*"subscription is disabled"*|*PaymentRequired*) echo "SEM CREDITO: assinatura desativada ou com limite de gasto atingido. Veja portal.azure.com > Assinaturas > Cost Management." ;;
              *QuotaExceeded*|*"quota"*|*OperationNotAllowed*) echo "SEM COTA de vCPU na regiao $REG. Peca aumento em portal.azure.com > Assinaturas > Uso + cotas." ;;
              *SkuNotAvailable*|*AllocationFailed*|*ZonalAllocationFailed*) echo "O Azure esta sem capacidade desse tamanho agora em $REG. Tente de novo mais tarde." ;;
              *RequestDisallowedByPolicy*) echo "Uma politica da organizacao bloqueou a criacao." ;;
              *) echo "Erro do Azure: $(echo "$1" | tail -c 400)" ;;
            esac
          }
          echo "::add-mask::$AUTHKEY"

          # Script que roda dentro do Windows (embutido em base64, sem nenhum segredo)
          base64 -d > /tmp/primeiro-boot.ps1 <<'B64EOF'
          cGFyYW0oCiAgW1BhcmFtZXRlcihNYW5kYXRvcnkgPSAkdHJ1ZSldW3N0cmluZ10kQXV0aEtleSwK
          ICBbUGFyYW1ldGVyKE1hbmRhdG9yeSA9ICR0cnVlKV1bc3RyaW5nXSRTZW5oYSwKICBbc3RyaW5n
          XSROb21lUEMgPSAnZ2FtZXJwYycsCiAgW3N0cmluZ10kVXN1YXJpbyA9ICdSYWZhZWwnCikKCiRF
          cnJvckFjdGlvblByZWZlcmVuY2UgPSAnU3RvcCcKJFByb2dyZXNzUHJlZmVyZW5jZSA9ICdTaWxl
          bnRseUNvbnRpbnVlJwpbTmV0LlNlcnZpY2VQb2ludE1hbmFnZXJdOjpTZWN1cml0eVByb3RvY29s
          ID0gW05ldC5TZWN1cml0eVByb3RvY29sVHlwZV06OlRsczEyCgpOZXctSXRlbSAtSXRlbVR5cGUg
          RGlyZWN0b3J5IC1Gb3JjZSAtUGF0aCBDOlxzZXR1cC1sb2dzIHwgT3V0LU51bGwKJExvZ0ZpbGUg
          PSAnQzpcc2V0dXAtbG9nc1xwcmltZWlyby1ib290LmxvZycKZnVuY3Rpb24gTG9nKCRtKSB7ICIk
          KEdldC1EYXRlIC1Gb3JtYXQgcykgJG0iIHwgT3V0LUZpbGUgLUZpbGVQYXRoICRMb2dGaWxlIC1B
          cHBlbmQgLUVuY29kaW5nIHV0ZjggfQpMb2cgIkluaWNpbyBkbyBwcmltZWlybyBib290IChhIGNo
          YXZlIGRvIFRhaWxzY2FsZSBudW5jYSBlIGdyYXZhZGEgbmVzdGUgbG9nKSIKCiMgMSkgQ29udGEg
          V2luZG93cwokc2VjID0gQ29udmVydFRvLVNlY3VyZVN0cmluZyAkU2VuaGEgLUFzUGxhaW5UZXh0
          IC1Gb3JjZQppZiAoR2V0LUxvY2FsVXNlciAtTmFtZSAkVXN1YXJpbyAtRXJyb3JBY3Rpb24gU2ls
          ZW50bHlDb250aW51ZSkgewogIFNldC1Mb2NhbFVzZXIgLU5hbWUgJFVzdWFyaW8gLVBhc3N3b3Jk
          ICRzZWMgLVBhc3N3b3JkTmV2ZXJFeHBpcmVzICR0cnVlCn0gZWxzZSB7CiAgTmV3LUxvY2FsVXNl
          ciAtTmFtZSAkVXN1YXJpbyAtUGFzc3dvcmQgJHNlYyAtUGFzc3dvcmROZXZlckV4cGlyZXMgLUFj
          Y291bnROZXZlckV4cGlyZXMgfCBPdXQtTnVsbAp9CkFkZC1Mb2NhbEdyb3VwTWVtYmVyIC1Hcm91
          cCAnQWRtaW5pc3RyYXRvcnMnIC1NZW1iZXIgJFVzdWFyaW8gLUVycm9yQWN0aW9uIFNpbGVudGx5
          Q29udGludWUKTG9nICJDb250YSAkVXN1YXJpbyBwcm9udGEiCgojIDIpIExvZ2luIGF1dG9tYXRp
          Y28gKG8gU3Vuc2hpbmUgcHJlY2lzYSBkZSB1bWEgc2Vzc2FvIGFiZXJ0YSBwYXJhIHRyYW5zbWl0
          aXIpCiR3bCA9ICdIS0xNOlxTT0ZUV0FSRVxNaWNyb3NvZnRcV2luZG93cyBOVFxDdXJyZW50VmVy
          c2lvblxXaW5sb2dvbicKU2V0LUl0ZW1Qcm9wZXJ0eSAtUGF0aCAkd2wgLU5hbWUgQXV0b0FkbWlu
          TG9nb24gLVZhbHVlICcxJwpTZXQtSXRlbVByb3BlcnR5IC1QY
