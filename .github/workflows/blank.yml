name: PC gamer Windows 11 (Azure)
on:
  workflow_dispatch:
    inputs:
      acao:
        description: O que fazer
        type: choice
        options: [criar, status, ligar, desligar, reiniciar, destruir]
        default: criar
      tamanho:
        description: Tamanho (auto = GPU se houver cota, senao 16 GB sem GPU)
        type: choice
        options: [auto, Standard_NV6ads_A10_v5, Standard_D4s_v5]
        default: auto
permissions:
  contents: read
  id-token: write
env:
  RG: gamerpc-rg
  VM: gamerpc
  USUARIO: Rafael
  LOC: ${{ vars.AZ_LOCATION || 'eastus' }}
  REPO: ${{ github.repository }}
  BRANCH: ${{ github.ref_name }}
  ACAO: ${{ inputs.acao }}
  TAM_IN: ${{ inputs.tamanho }}
  AZ_CID: ${{ secrets.AZ_CLIENT_ID || vars.AZ_CLIENT_ID }}
  AZ_TID: ${{ secrets.AZ_TENANT_ID || vars.AZ_TENANT_ID }}
  AZ_SID: ${{ secrets.AZ_SUBSCRIPTION_ID || vars.AZ_SUBSCRIPTION_ID }}
jobs:
  pc:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # ---- 1) LOGIN NO AZURE com acesso de servico (secret AZURE_CREDENTIALS) ----
      - name: Conferir o secret AZURE_CREDENTIALS
        env:
          CRED: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          set +e
          set -uo pipefail
          echo "=== INICIO DO PASSO: $(date -u +%H:%M:%S) UTC ==="
          if [ -z "${CRED:-}" ]; then
            MSG="FALTA O SECRET AZURE_CREDENTIALS. Crie o acesso no Azure Cloud Shell (comando no chat) e salve o JSON em Settings > Secrets and variables > Actions com o nome AZURE_CREDENTIALS."
            echo ""; echo "=============== ERRO ==============="; echo "$MSG"; echo "===================================="
            echo "::error::$MSG"
            { echo "## Nao foi possivel continuar"; echo ""; echo "$MSG"; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if ! echo "$CRED" | jq -e '.clientId and .clientSecret and .tenantId and .subscriptionId' >/dev/null 2>&1; then
            MSG="O secret AZURE_CREDENTIALS existe, mas nao e um JSON valido com clientId, clientSecret, tenantId e subscriptionId. Cole de novo o JSON inteiro, com as chaves { }."
            echo ""; echo "=============== ERRO ==============="; echo "$MSG"; echo "===================================="
            echo "::error::$MSG"
            { echo "## Nao foi possivel continuar"; echo ""; echo "$MSG"; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Secret AZURE_CREDENTIALS encontrado e com o formato certo."

      - name: Login Azure (acesso de servico)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ---- 2) VERIFICAR ASSINATURA, ESTADO, OFERTA E PERMISSOES ----
      - name: Verificar assinatura, estado, oferta e permissoes
        run: |
          set +e
          set -uo pipefail
          echo "=== INICIO DO PASSO: $(date -u +%H:%M:%S) UTC ==="
          FALHOU=0
          trap 'rc=$?; if [ "$rc" -ne 0 ] && [ "$FALHOU" = 0 ]; then echo "ERRO INESPERADO: o passo terminou com codigo $rc (linha $LINENO do script)"; echo "::error::Passo falhou com codigo $rc na linha $LINENO"; { echo "## ERRO INESPERADO"; echo "O passo terminou com codigo $rc na linha $LINENO. Abra o log do passo e veja as ultimas linhas."; } >> "$GITHUB_STEP_SUMMARY"; fi' EXIT
          falha() { FALHOU=1; echo ""; echo "=============== ERRO ==============="; echo "$1"; echo "===================================="; echo "::error::$1"; { echo "## Nao foi possivel continuar"; echo ""; echo "$1"; } >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          FILTRO="!starts_with(name,'N/A(tenant')"
          az account list --all --refresh -o none 2>/dev/null
          CONTA=$(az account show --query user.name -o tsv 2>/dev/null || echo "?")
          TOTAL=$(az account list --all --query "[?$FILTRO] | length(@)" -o tsv 2>/dev/null || echo 0)
          ATIVAS=$(az account list --all --query "[?state=='Enabled' && $FILTRO] | length(@)" -o tsv 2>/dev/null || echo 0)

          if [ "${TOTAL:-0}" = 0 ]; then
            if [ -n "${AZ_CID:-}" ]; then
              falha "O app do Azure (AZ_CLIENT_ID) nao enxerga nenhuma assinatura. Crie em https://azure.microsoft.com/free, ou apague os Secrets AZ_* para refazer pelo login por codigo."
            fi
            falha "FALTA ASSINATURA: a conta $CONTA nao tem assinatura. Crie em https://azure.microsoft.com/free e rode de novo."
          fi
          if [ "${ATIVAS:-0}" = 0 ]; then
            ESTADOS=$(az account list --all --query "[?$FILTRO].state" -o tsv | sort -u | tr '\n' ' ')
            falha "ASSINATURA NAO ESTA ATIVA (estado: $ESTADOS). Resolva em portal.azure.com > Assinaturas."
          fi

          SUB="${AZ_SID:-}"
          if [ -z "$SUB" ]; then
            SUB=$(az account list --all --query "[?state=='Enabled' && $FILTRO] | [0].id" -o tsv)
          fi
          az account set --subscription "$SUB" 2>/tmp/err || falha "A assinatura informada nao esta acessivel. Detalhe: $(head -c 300 /tmp/err)"
          NOME=$(az account show --query name -o tsv)

          INFO=$(az rest --method get --url "https://management.azure.com/subscriptions/$SUB?api-version=2020-01-01" -o json 2>/dev/null || echo '{}')
          QUOTA=$(echo "$INFO" | jq -r '.subscriptionPolicies.quotaId // "desconhecida"')
          LIMITE=$(echo "$INFO" | jq -r '.subscriptionPolicies.spendingLimit // "desconhecido"')
          NOTA=""
          case "$QUOTA" in
            FreeTrial*) NOTA="Teste gratuito: o credito e limitado e a GPU NVIDIA normalmente fica bloqueada. Para usar GPU, faca Upgrade para pagamento conforme o uso no portal." ;;
          esac
          if [ "$LIMITE" = "On" ]; then NOTA="$NOTA Limite de gasto ativado: alguns tamanhos de VM podem ser bloqueados."; fi

          PERM=$(az rest --method get --url "https://management.azure.com/subscriptions/$SUB/providers/Microsoft.Authorization/permissions?api-version=2022-04-01" --query "value[].actions[]" -o tsv 2>/dev/null || true)
          if [ -z "$PERM" ]; then
            PODE="nao foi possivel verificar (sera testado ao criar)"
          elif echo "$PERM" | grep -qxE '\*|Microsoft\.Compute/\*|Microsoft\.Compute/virtualMachines/write'; then
            PODE="sim"
          else
            PODE="nao"
          fi
          if [ "$PODE" = "nao" ]; then
            falha "SEM PERMISSAO PARA CRIAR MAQUINAS VIRTUAIS em $NOME. De o papel Contributor (ou Owner) para $CONTA em portal.azure.com > Assinaturas > Controle de acesso (IAM)."
          fi

          echo "Assinatura em uso: $NOME"
          echo "ASSINATURA=$NOME" >> "$GITHUB_ENV"
          echo "OFERTA=$QUOTA" >> "$GITHUB_ENV"
          {
            echo "## VERIFICACAO DA ASSINATURA"
            echo "| Item | Valor |"; echo "|---|---|"
            echo "| Conta autenticada | $CONTA |"
            echo "| Assinatura | $NOME |"
            echo "| ID da assinatura | \`$SUB\` |"
            echo "| Estado | Enabled (ativa) |"
            echo "| Tipo de oferta | $QUOTA |"
            echo "| Limite de gasto | $LIMITE |"
            echo "| Pode criar VMs | $PODE |"
            if [ -n "$NOTA" ]; then echo ""; echo "**Atencao:** $NOTA"; fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      # ---- 3) PREPARAR: provedores, regiao, GPU e cota ----
      - name: Preparar recursos e verificar GPU / cota
        id: prep
        if: inputs.acao == 'criar'
        env:
          AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          set +e
          set -uo pipefail
          echo "=== INICIO DO PASSO: $(date -u +%H:%M:%S) UTC ==="
          FALHOU=0
          trap 'rc=$?; if [ "$rc" -ne 0 ] && [ "$FALHOU" = 0 ]; then echo "ERRO INESPERADO: o passo terminou com codigo $rc (linha $LINENO do script)"; echo "::error::Passo falhou com codigo $rc na linha $LINENO"; { echo "## ERRO INESPERADO"; echo "O passo terminou com codigo $rc na linha $LINENO. Abra o log do passo e veja as ultimas linhas."; } >> "$GITHUB_STEP_SUMMARY"; fi' EXIT
          falha() { FALHOU=1; echo ""; echo "=============== ERRO ==============="; echo "$1"; echo "===================================="; echo "::error::$1"; { echo "## Nao foi possivel criar o PC"; echo ""; echo "$1"; } >> "$GITHUB_STEP_SUMMARY"; exit 1; }

          if [ -z "$AUTHKEY" ]; then
            falha "FALTA O SECRET TAILSCALE_AUTH_KEY. Crie em Settings > Secrets and variables > Actions e rode de novo."
          fi

          for P in Microsoft.Compute Microsoft.Network Microsoft.Storage; do
            az provider register --namespace "$P" --wait -o none 2>/tmp/err \
              || falha "SEM PERMISSAO para ativar o provedor $P. Detalhe: $(head -c 300 /tmp/err)"
          done

          if az vm show -g "$RG" -n "$VM" -o none 2>/dev/null; then
            falha "O PC $VM ja existe. Rode a acao destruir antes de criar de novo."
          fi

          OUTRAS="eastus eastus2 westus2 westus3 southcentralus centralus westeurope northeurope"
          MOTIVOS=""

          livre() {
            echo "$1" | jq -r --arg f "$2" '[.[] | select((.name.value | ascii_downcase) == ($f | ascii_downcase)) | ((.limit | tonumber) - (.currentValue | tonumber))] | .[0] // 0' 2>/dev/null || echo 0
          }

          checa() {
            local R="$1" S="$2" F="$3" V="$4" N RS U FAM TOT
            N=$(az vm list-skus -l "$R" --size "$S" --resource-type virtualMachines --query "length(@)" -o tsv 2>/dev/null || echo 0)
            if [ "${N:-0}" -le 0 ]; then MOTIVOS+=$'\n'"- $S nao e oferecido em $R"; return 1; fi
            RS=$(az vm list-skus -l "$R" --size "$S" --resource-type virtualMachines --query "[0].restrictions | length(@)" -o tsv 2>/dev/null || echo 0)
            if [ "${RS:-0}" != 0 ]; then MOTIVOS+=$'\n'"- $S esta bloqueado para esta assinatura em $R"; return 1; fi
            U=$(az vm list-usage -l "$R" -o json 2>/dev/null || echo '[]')
            FAM=$(livre "$U" "$F"); TOT=$(livre "$U" cores)
            if [ "${FAM:-0}" -lt "$V" ]; then MOTIVOS+=$'\n'"- $S em $R: cota da familia $F = ${FAM:-0} vCPU livres (precisa de $V)"; return 1; fi
            if [ "${TOT:-0}" -lt "$V" ]; then MOTIVOS+=$'\n'"- $S em $R: cota total de vCPU = ${TOT:-0} livres (precisa de $V)"; return 1; fi
            return 0
          }

          ESC=""; REG=""; AVISO=""
          if [ "$TAM_IN" != "Standard_D4s_v5" ]; then
            for R in $LOC $OUTRAS; do
              if checa "$R" Standard_NV6ads_A10_v5 standardNVadsA10v5Family 6; then ESC=Standard_NV6ads_A10_v5; REG="$R"; break; fi
            done
            if [ -z "$ESC" ] && [ "$TAM_IN" = "Standard_NV6ads_A10_v5" ]; then
              falha "SEM COTA/DISPONIBILIDADE DE GPU NVIDIA (A10) em nenhuma regiao testada.$MOTIVOS"$'\n\n'"Para liberar: portal.azure.com > Assinaturas > Uso + cotas, filtre por NVadsA10v5 e peca 6 vCPU."
            fi
          fi
          if [ -z "$ESC" ]; then
            GPUMOT="$MOTIVOS"; MOTIVOS=""
            for R in $LOC $OUTRAS; do
              if checa "$R" Standard_D4s_v5 standardDSv5Family 4; then ESC=Standard_D4s_v5; REG="$R"; break; fi
            done
            if [ -z "$ESC" ]; then
              falha "SEM COTA DE vCPU para criar o PC.$GPUMOT$MOTIVOS"$'\n\n'"Peca aumento em portal.azure.com > Assinaturas > Uso + cotas."
            fi
            if [ "$TAM_IN" != "Standard_D4s_v5" ]; then
              AVISO="Sem GPU: a conta nao tem cota/disponibilidade da NVIDIA A10.$GPUMOT"
            fi
          fi

          if [ "$ESC" = Standard_NV6ads_A10_v5 ]; then RAM="55 GB (menor tamanho com GPU A10)"; GPU="NVIDIA A10 (fracao de 1/6)"; else RAM="16 GB"; GPU="sem GPU"; fi
          echo "Escolhido: $ESC em $REG"
          echo "regiao=$REG" >> "$GITHUB_OUTPUT"
          echo "tamanho=$ESC" >> "$GITHUB_OUTPUT"
          echo "ram=$RAM" >> "$GITHUB_OUTPUT"
          echo "gpu=$GPU" >> "$GITHUB_OUTPUT"
          echo "aviso=$(echo "$AVISO" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      # ---- 4) CRIAR O PC (RECONSTRUIDO: o anexo original veio cortado aqui) ----
      - name: Criar o PC (VM real no Azure)
        id: criar
        if: inputs.acao == 'criar'
        env:
          AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          TAM: ${{ steps.prep.outputs.tamanho }}
          REG: ${{ steps.prep.outputs.regiao }}
          RAM: ${{ steps.prep.outputs.ram }}
          GPU: ${{ steps.prep.outputs.gpu }}
          AVISO: ${{ steps.prep.outputs.aviso }}
        run: |
          set +e
          set -uo pipefail
          echo "=== INICIO DO PASSO: $(date -u +%H:%M:%S) UTC ==="
          FALHOU=0
          trap 'rc=$?; if [ "$rc" -ne 0 ] && [ "$FALHOU" = 0 ]; then echo "ERRO INESPERADO: o passo terminou com codigo $rc (linha $LINENO do script)"; echo "::error::Passo falhou com codigo $rc na linha $LINENO"; { echo "## ERRO INESPERADO"; echo "O passo terminou com codigo $rc na linha $LINENO. Abra o log do passo e veja as ultimas linhas."; } >> "$GITHUB_STEP_SUMMARY"; fi' EXIT
          falha() { FALHOU=1; echo ""; echo "=============== ERRO ==============="; echo "$1"; echo "===================================="; echo "::error::$1"; { echo "## Nao foi possivel criar o PC"; echo ""; echo "$1"; } >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          traduz() {
            case "$1" in
              *AuthorizationFailed*|*"does not have authorization"*) echo "SEM PERMISSAO: a conta/app precisa ser Contributor ou Owner da assinatura." ;;
              *SpendingLimitReached*|*ReadOnlyDisabledSubscription*|*SubscriptionDisabled*|*PaymentRequired*) echo "SEM CREDITO: assinatura desativada ou com limite de gasto atingido." ;;
              *QuotaExceeded*|*"quota"*|*OperationNotAllowed*) echo "SEM COTA de vCPU na regiao $REG. Peca aumento em Uso + cotas." ;;
              *SkuNotAvailable*|*AllocationFailed*|*ZonalAllocationFailed*) echo "O Azure esta sem capacidade desse tamanho agora em $REG. Tente mais tarde." ;;
              *RequestDisallowedByPolicy*) echo "Uma politica da organizacao bloqueou a criacao." ;;
              *) echo "Erro do Azure: $(echo "$1" | tail -c 400)" ;;
            esac
          }
          echo "::add-mask::$AUTHKEY"

          SENHA="Aa1-$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 16)"
          echo "::add-mask::$SENHA"

          cat > /tmp/primeiro-boot.ps1 <<'PSEOF'
          param(
            [Parameter(Mandatory = $true)][string]$AuthKey,
            [string]$NomePC = 'gamerpc'
          )
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          New-Item -ItemType Directory -Force -Path C:\setup-logs | Out-Null
          $LogFile = 'C:\setup-logs\primeiro-boot.log'
          function Log($m) { "$(Get-Date -Format s) $m" | Out-File -FilePath $LogFile -Append -Encoding utf8 }
          Log 'Inicio (a chave do Tailscale nunca e gravada neste log)'

          # Area de Trabalho Remota
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop' -ErrorAction SilentlyContinue
          Log 'RDP ligado'

          # Tailscale
          $msi = 'C:\setup-logs\tailscale.msi'
          Invoke-WebRequest -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' -OutFile $msi
          Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /quiet /norestart" -Wait
          Start-Sleep -Seconds 10
          & 'C:\Program Files\Tailscale\tailscale.exe' up --auth-key=$AuthKey --hostname=$NomePC --unattended 2>&1 | Out-Null
          Log 'Tailscale conectado'
          PSEOF

          az group create -n "$RG" -l "$REG" -o none 2>/tmp/err || falha "$(traduz "$(cat /tmp/err)")"

          echo "Criando a VM $TAM em $REG (leva alguns minutos)..."
          az vm create -g "$RG" -n "$VM" -l "$REG" --size "$TAM" \
            --image MicrosoftWindowsDesktop:windows-11:win11-23h2-pro:latest \
            --admin-username "$USUARIO" --admin-password "$SENHA" \
            --license-type Windows_Client --os-disk-size-gb 256 \
            --public-ip-sku Standard --nsg-rule NONE -o none 2>/tmp/err \
            || falha "$(traduz "$(cat /tmp/err)")"

          if [ "$TAM" = Standard_NV6ads_A10_v5 ]; then
            echo "Instalando driver NVIDIA..."
            az vm extension set -g "$RG" --vm-name "$VM" --publisher Microsoft.HpcCompute \
              --name NvidiaGpuDriverWindows --version 1.6 -o none 2>/tmp/err \
              || echo "::warning::Driver NVIDIA nao instalou: $(head -c 300 /tmp/err)"
          fi

          echo "Rodando configuracao dentro do Windows..."
          az vm run-command invoke -g "$RG" -n "$VM" --command-id RunPowerShellScript \
            --scripts @/tmp/primeiro-boot.ps1 --parameters "AuthKey=$AUTHKEY" "NomePC=$VM" -o none 2>/tmp/err \
            || echo "::warning::Configuracao interna falhou: $(head -c 300 /tmp/err)"

          {
            echo "## PC CRIADO"
            echo "| Item | Valor |"; echo "|---|---|"
            echo "| Nome na rede Tailscale | $VM |"
            echo "| Usuario | $USUARIO |"
            echo "| Senha | \`$SENHA\` |"
            echo "| Tamanho | $TAM |"
            echo "| Regiao | $REG |"
            echo "| Memoria | $RAM |"
            echo "| GPU | $GPU |"
            echo ""
            echo "Conecte pelo Tailscale (Area de Trabalho Remota) usando o nome $VM. Anote a senha agora."
            if [ -n "${AVISO// /}" ]; then echo ""; echo "**Aviso:** $AVISO"; fi
            echo ""
            echo "**Atencao:** VM ligada gasta credito. Rode a acao desligar quando terminar."
          } >> "$GITHUB_STEP_SUMMARY"

      # ---- 5) OUTRAS ACOES (RECONSTRUIDO) ----
      - name: Status, ligar, desligar, reiniciar ou destruir
        if: inputs.acao != 'criar'
        run: |
          set +e
          set -uo pipefail
          echo "=== INICIO DO PASSO: $(date -u +%H:%M:%S) UTC ==="
          FALHOU=0
          trap 'rc=$?; if [ "$rc" -ne 0 ] && [ "$FALHOU" = 0 ]; then echo "ERRO INESPERADO: o passo terminou com codigo $rc (linha $LINENO do script)"; echo "::error::Passo falhou com codigo $rc na linha $LINENO"; { echo "## ERRO INESPERADO"; echo "O passo terminou com codigo $rc na linha $LINENO. Abra o log do passo e veja as ultimas linhas."; } >> "$GITHUB_STEP_SUMMARY"; fi' EXIT
          falha() { FALHOU=1; echo ""; echo "=============== ERRO ==============="; echo "$1"; echo "===================================="; echo "::error::$1"; { echo "## Nao foi possivel executar"; echo ""; echo "$1"; } >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          if [ "$ACAO" != destruir ]; then
            az vm show -g "$RG" -n "$VM" -o none 2>/dev/null || falha "O PC $VM nao existe. Rode a acao criar."
          fi
          case "$ACAO" in
            status)
              ESTADO=$(az vm get-instance-view -g "$RG" -n "$VM" --query "instanceView.statuses[?starts_with(code,'PowerState/')].displayStatus | [0]" -o tsv)
              echo "## Status do PC: $ESTADO" >> "$GITHUB_STEP_SUMMARY"
              echo "Status: $ESTADO" ;;
            ligar)
              az vm start -g "$RG" -n "$VM" -o none || falha "Nao foi possivel ligar."
              echo "## PC ligado" >> "$GITHUB_STEP_SUMMARY" ;;
            desligar)
              az vm deallocate -g "$RG" -n "$VM" -o none || falha "Nao foi possivel desligar."
              echo "## PC desligado (sem cobranca de computacao; o disco ainda cobra pouco)" >> "$GITHUB_STEP_SUMMARY" ;;
            reiniciar)
              az vm restart -g "$RG" -n "$VM" -o none || falha "Nao foi possivel reiniciar."
              echo "## PC reiniciado" >> "$GITHUB_STEP_SUMMARY" ;;
            destruir)
              az group delete -n "$RG" --yes --no-wait -o none 2>/dev/null || true
              echo "## PC e todos os recursos estao sendo apagados" >> "$GITHUB_STEP_SUMMARY" ;;
          esac
          
